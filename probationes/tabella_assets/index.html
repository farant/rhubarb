<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tabella salutationum</title>
<style>
  body { background: #22201d; color: #ece5d8; font: 14px/1.5 monospace;
         padding: 2em; max-width: 36em; margin: 0 auto; }
  h1 { color: #d8b978; font-size: 1.4em; }
  button { background: #453d2f; color: #ece5d8; border: 1px solid #8a7a55;
           padding: .5em 1em; font: inherit; cursor: pointer;
           border-radius: 4px; }
  button:hover { background: #5a4f3c; }
  input { background: #171512; color: #ece5d8; border: 1px solid #8a7a55;
          padding: .4em; font: inherit; width: 16em; border-radius: 4px; }
  ul#tituli { background: #171512; border: 1px solid #453d2f;
              padding: 1em 1em 1em 2.5em; border-radius: 4px;
              min-height: 4em; margin-top: 1em; }
  #numerus { color: #9fb87a; }
</style>
</head>
<body>
<h1>tabella salutationum</h1>
<p>
  <input id="titulus" placeholder="salutatio nova...">
  <button id="inscribere">inscribere</button>
</p>
<p>inscriptae: <span id="numerus">0</span></p>
<ul id="tituli"></ul>
<script>
function reddere() {
  return internuntius.vocare('legere', {}).then(function(r) {
    var ul = document.getElementById('tituli');
    ul.innerHTML = '';
    r.tituli.forEach(function(t) {
      var li = document.createElement('li');
      li.textContent = t;
      ul.appendChild(li);
    });
    document.getElementById('numerus').textContent = r.numerus;
  });
}
document.getElementById('inscribere').onclick = function() {
  var campus = document.getElementById('titulus');
  if (!campus.value) { return; }
  internuntius.vocare('inscribere', { titulus: campus.value })
    .then(function() { campus.value = ''; return reddere(); });
};
/* fumus in onere: inscriptio automatica + relectio - status
   C-lateris per gyrum plenum sine oculis probatur */
internuntius.vocare('inscribere', { titulus: 'ave, tabella' })
  .then(reddere);
</script>
</body>
</html>
