<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>silex</title>
<style>
  /* fundamentum solum - cetera omnia <mensa-thema> possidet */
  html, body { height: 100%; margin: 0; }
</style>
</head>
<body>
<mensa-thema>
<mensa-planum id="planum">

  <mensa-scida id="status" x="6" y="8" latitudo="34">
    <h2>SILEX &#10022; status</h2>
    <dl>
      <dt>versio</dt><dd id="versio">&hellip;</dd>
      <dt>fabrica</dt><dd id="fabrica">&hellip;</dd>
      <dt>pons</dt><dd id="pons">exspectans&hellip;</dd>
    </dl>
  </mensa-scida>

  <mensa-scida id="verba" x="46" y="8" latitudo="40">
    <h2>verba</h2>
    <dl>
      <dt class="vivum">novum</dt>
      <dd>proiectum e fabrica excudere</dd>
      <dt class="vivum">status</dt><dd>arbor contra manifestum</dd>
      <dt class="vivum">condere</dt><dd>arborem absorbere</dd>
      <dt class="vivum">historia</dt><dd>acta ambulare</dd>
      <dt class="vivum">proicere</dt>
      <dd>volumen arborem scribit (-ad = iter temporis)</dd>
      <dt class="vivum">renovare</dt>
      <dd>bibliothecae sigillis tribus</dd>
    </dl>
  </mensa-scida>

  <silex-conditiones id="vcs-conditiones" x="4" y="34"
    latitudo="27"></silex-conditiones>
  <silex-plagulae id="vcs-plagulae" x="34" y="34"
    latitudo="27"></silex-plagulae>
  <silex-contentum id="vcs-contentum" x="64" y="34"
    latitudo="32"></silex-contentum>

</mensa-planum>
</mensa-thema>

<style>
  /* stilus localis app - super thema */
  dt { color: var(--mensa-textus-secundus); float: left; clear: left;
       width: 7.5em; }
  dt.vivum { color: var(--mensa-accentus); }
  dd { margin-left: 8em; word-break: break-all; }
  #pons { color: #8fd49a; }
  #pons.culpa { color: #d47a7a; }
</style>

<script src="mensa.js"></script>
<script src="repositorium.js"></script>
<script>
/* status silicis in scidam */
internuntius.vocare('status', {})
  .then(function(r) {
    document.getElementById('versio').textContent = r.versio;
    document.getElementById('fabrica').textContent = r.fabrica;
    document.getElementById('pons').textContent =
      'vivus (fabrica ' + (r.fabrica_valida ? 'valida' : 'INVALIDA')
      + ')';
  })
  .catch(function(e) {
    var pons = document.getElementById('pons');
    pons.textContent = 'CULPA: ' + e.message;
    pons.className = 'culpa';
  });

/* tabula persistens: positiones + scidulae in
   ~/.rhubarb/silex.volumen (latus C: mensa_praebere) */
mensaPersistentia(document.getElementById('planum'));

/* chartae VCS: praebitor iniectus (chartae pontem numquam
   nominant - lex DI); oneratio incipit */
silexVcs({
  historia: function () {
    return internuntius.vocare('vcs_historia', {});
  },
  plica: function (seq) {
    return internuntius.vocare('vcs_plica', { seq: seq });
  },
  plagula: function (seq, via) {
    return internuntius.vocare('vcs_plagula',
      { seq: seq, plagula: via });
  }
});
</script>
</body>
</html>
