<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>forum</title>
<style>
  body { background: #22201d; color: #ece5d8; font: 22px/1.5 monospace;
         padding: 1em .6em; max-width: 34em; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 1.5em;
           border-bottom: 1px solid #453d2f; padding-bottom: .6em; }
  h1 { color: #d8b978; font-size: 1.4em; margin: 0; }
  h2 { color: #d8b978; font-size: 1.2em; margin: .4em 0; }
  nav a { color: #9fb87a; margin-right: 1em; cursor: pointer;
          text-decoration: none; }
  nav a.activa { color: #d8b978; border-bottom: 1px solid #d8b978; }
  textarea, input { background: #171512; color: #ece5d8; width: 100%;
             border: 1px solid #8a7a55; padding: .5em; font: inherit;
             border-radius: 4px; box-sizing: border-box; }
  textarea { resize: vertical; }
  button { background: #453d2f; color: #ece5d8; border: 1px solid #8a7a55;
           padding: .45em 1.1em; font: inherit; cursor: pointer;
           border-radius: 4px; }
  button:hover { background: #5a4f3c; }
  button:disabled { color: #6b6357; border-color: #453d2f; cursor: default; }
  button.parva { font-size: .7em; padding: .25em .7em; }
  a.actio { color: #9fb87a; cursor: pointer; font-size: .75em;
            margin-right: .9em; text-decoration: none; }
  a.actio:hover { color: #d8b978; }
  #compositio { margin: 1.2em 0 .6em; }
  #pes-compositionis { display: flex; justify-content: space-between;
                       align-items: center; margin-top: .4em; }
  .numerator { color: #9fb87a; font-size: .8em; }
  .numerator.nimius { color: #d97c6a; }
  #nuntius-erroris { color: #d97c6a; margin: .6em 0; min-height: 1.2em;
                     font-size: .8em; }
  .pipatum, .commentarium { background: #171512; border: 1px solid #453d2f;
             border-radius: 4px; padding: .7em .9em; margin: .7em 0; }
  .subscriptio { color: #d8b978; }
  .tempus { color: #6b6357; font-size: .75em; }
  .corpus { margin-top: .3em; white-space: pre-wrap;
            overflow-wrap: break-word; }
  .remotum { color: #6b6357; font-style: italic; margin-top: .3em; }
  .responsa { margin-left: 1.4em; border-left: 2px solid #453d2f;
              padding-left: .8em; }
  .actiones { margin-top: .4em; }
  .arca-responsi { margin-top: .5em; }
  #vacuum, #vacuum-articuli { color: #6b6357; margin: 2em 0;
                              text-align: center; }
  .ordo-articuli { background: #171512; border: 1px solid #453d2f;
                   border-radius: 4px; padding: .7em .9em; margin: .7em 0;
                   cursor: pointer; display: flex;
                   justify-content: space-between; align-items: baseline; }
  .ordo-articuli:hover { border-color: #8a7a55; }
  .sigillum { font-size: .7em; padding: .1em .6em; border-radius: 8px;
              border: 1px solid #6b6357; color: #9c9285; }
  .sigillum.publicatum { color: #9fb87a; border-color: #9fb87a; }
  .sigillum.conditum { color: #d8b978; border-color: #d8b978; }
  .sigillum.retractum { color: #6b6357; }
  #articulus-corpus p { margin: .8em 0; white-space: pre-line; }
  .caput-actionum { display: flex; gap: .6em; align-items: center;
                    flex-wrap: wrap; margin: .5em 0 1em; }
  #editor-titulus { margin: .8em 0 .5em; }
  #barra-superior { margin: 1em 0 .5em; display: flex;
                    justify-content: space-between; align-items: center; }
  a.retro { color: #9fb87a; cursor: pointer; text-decoration: none; }
  /* ---- genera (G2) ---- */
  select { background: #171512; color: #ece5d8; border: 1px solid #8a7a55;
           font: inherit; padding: .3em; border-radius: 4px; }
  /* tabula lata: continens volvit (numquam pagina), tabula ad
     contentum crescit, columnae latitudines minimas per typum */
  #res-tabula-continens { overflow-x: auto; padding-bottom: .3em; }
  table.res { width: max-content; min-width: 100%;
              border-collapse: collapse; margin-top: .6em;
              font-size: .85em; }
  table.res th, table.res td { min-width: 5em; }
  table.res .col-textus, table.res .col-area { min-width: 10em;
              max-width: 18em; }
  table.res .col-relatio { min-width: 8em; max-width: 14em; }
  table.res .col-annus, table.res .col-numerus,
  table.res .col-veritas, table.res .col-dies,
  table.res .col-electio, table.res .col-tags { white-space: nowrap; }
  table.res th { color: #d8b978; text-align: left; cursor: pointer;
                 border-bottom: 1px solid #8a7a55; padding: .3em .5em;
                 white-space: nowrap; }
  table.res th .sagitta { color: #9fb87a; }
  table.res td { border-bottom: 1px solid #453d2f; padding: .35em .5em;
                 overflow-wrap: break-word; }
  table.res tr.ordo-entis { cursor: pointer; }
  table.res tr.ordo-entis:hover td { background: #171512; }
  .clavis-praevisa { color: #6b6357; font-size: .75em;
                     margin: .3em 0 .8em; }
  .ordo-campi { display: flex; gap: .5em; margin: .4em 0;
                align-items: center; flex-wrap: wrap; }
  .ordo-campi input { flex: 2; min-width: 8em; }
  .ordo-campi select { flex: 1; }
  .ordo-campi a { color: #d97c6a; cursor: pointer;
                  text-decoration: none; }
  .optio-creatoris { margin: .5em 0; display: flex; gap: .6em;
                     align-items: center; font-size: .85em;
                     color: #9fb87a; flex-wrap: wrap; }
  .chip { display: inline-block; background: #453d2f;
          border-radius: 8px; padding: .1em .6em;
          margin: .15em .3em .15em 0; font-size: .85em; }
  .chip a { color: #d97c6a; cursor: pointer; margin-left: .4em;
            text-decoration: none; }
  .praebita { position: relative; }
  .praebita-index { position: absolute; z-index: 5;
                    background: #171512; border: 1px solid #8a7a55;
                    border-radius: 4px; width: 100%;
                    max-height: 12em; overflow-y: auto; }
  .praebita-index div { padding: .3em .6em; cursor: pointer; }
  .praebita-index div:hover { background: #453d2f; }
  .praebita-index div.creare-novum { color: #9fb87a;
                                     font-style: italic; }
  .campus-formae { margin: .7em 0; }
  .campus-formae label { display: block; color: #9fb87a;
                         font-size: .8em; margin-bottom: .2em; }
  .aera { color: #6b6357; font-size: .75em; margin-left: .5em; }
  .porticus { margin-top: 1.2em; border-top: 1px solid #453d2f;
              padding-top: .6em; }
  .porticus h3 { color: #d8b978; font-size: .95em; margin: .3em 0; }
  .porticus a { color: #9fb87a; cursor: pointer; display: block;
                margin: .2em 0; text-decoration: none; }
  .valor-entis { margin: .5em 0; }
  .valor-entis .titulus-campi { color: #9fb87a; font-size: .8em; }
  #res-quaestio-domus { margin: .6em 0; }
  .extra-specem { color: #d97c6a; }
</style>
</head>
<body>
<header>
  <h1>forum</h1>
  <nav>
    <a id="nav-pipata" class="activa">Pipata</a>
    <a id="nav-articuli">Articuli</a>
    <a id="nav-res">Res</a>
  </nav>
</header>
<div id="nuntius-erroris"></div>

<section id="visus-pipata">
  <div id="compositio">
    <textarea id="arca-pipati" rows="3" placeholder="quid novi?"></textarea>
    <div id="pes-compositionis">
      <span id="numerator-pipati" class="numerator">0 / 240</span>
      <button id="pipare">pipare</button>
    </div>
  </div>
  <div id="tabula"></div>
  <div id="vacuum" hidden>silentium in foro - pipa primum!</div>
</section>

<section id="visus-articuli" hidden>
  <div id="barra-superior">
    <span></span>
    <button id="novus-articulus">novus articulus</button>
  </div>
  <div id="index-articulorum"></div>
  <div id="vacuum-articuli" hidden>nulli articuli - scribe primum!</div>
</section>

<section id="visus-articulus" hidden>
  <div id="barra-superior"><a class="retro" id="retro-articuli">&larr; articuli</a></div>
  <div id="articulus-caput"></div>
  <div id="articulus-corpus"></div>
  <div id="filum"></div>
  <div id="arca-commentarii-domus">
    <textarea id="arca-commentarii" rows="2"
      placeholder="commentarium..."></textarea>
    <div id="pes-compositionis">
      <span></span>
      <button id="commentari">commentari</button>
    </div>
  </div>
</section>

<section id="visus-editor" hidden>
  <div id="barra-superior"><a class="retro" id="editor-retro">&larr; relinquere</a></div>
  <input id="editor-titulus" placeholder="titulus...">
  <textarea id="editor-corpus" rows="14"
    placeholder="corpus - linea vacua = paragraphus nova"></textarea>
  <div id="pes-compositionis">
    <span></span>
    <button id="editor-servare">servare</button>
  </div>
</section>

<section id="visus-res" hidden>
  <div id="res-index-domus">
    <div id="barra-superior">
      <span></span>
      <button id="genus-novum">genus novum</button>
    </div>
    <div id="res-index"></div>
    <div id="vacuum-generum" hidden>nulla genera - defini primum!</div>
  </div>

  <div id="res-creator-domus" hidden>
    <div id="barra-superior"><a class="retro" id="creator-retro">&larr; genera</a></div>
    <h2>genus novum</h2>
    <input id="creator-titulus" placeholder="titulus generis (e.g. Liber)">
    <div class="clavis-praevisa" id="creator-clavis">clavis: &mdash;</div>
    <div id="creator-campi"></div>
    <button id="creator-campum-addere" class="parva">+ campum addere</button>
    <div class="optio-creatoris">
      <span>campus tituli:</span> <select id="creator-campus-tituli"></select>
    </div>
    <div class="optio-creatoris">
      <span>ordo ordinarius:</span> <select id="creator-ordo-campus"></select>
      <select id="creator-ordo-directio">
        <option value="ascendens">ascendens</option>
        <option value="descendens">descendens</option>
      </select>
    </div>
    <div id="pes-compositionis">
      <span></span>
      <button id="creator-servare">genus creare</button>
    </div>
  </div>

  <div id="res-tabula-domus" hidden>
    <div id="barra-superior">
      <a class="retro" id="tabula-retro">&larr; genera</a>
      <span>
        <button id="genus-recensere" class="parva">genus recensere</button>
        <button id="ens-novum">novum</button>
      </span>
    </div>
    <h2 id="tabula-titulus"></h2>
    <div id="res-quaestio-domus">
      <input id="res-quaestio" placeholder="quaerere (FTS)...">
    </div>
    <div id="res-tabula-continens"></div>
  </div>

  <div id="res-ens-domus" hidden>
    <div id="barra-superior"><a class="retro" id="ens-retro">&larr; tabula</a></div>
    <div id="res-ens"></div>
    <div id="arca-commentarii-entis-domus">
      <textarea id="arca-commentarii-entis" rows="2" data-inter="verum"
        placeholder="commentarium de hac re..."></textarea>
      <div id="pes-compositionis">
        <span></span>
        <button id="commentari-ens">commentari</button>
      </div>
    </div>
  </div>

  <div id="res-forma-domus" hidden>
    <div id="barra-superior"><a class="retro" id="forma-retro">&larr; relinquere</a></div>
    <h2 id="forma-caput"></h2>
    <div id="res-forma"></div>
    <div id="pes-compositionis">
      <span id="forma-culpa" class="numerator"></span>
      <button id="forma-servare">servare</button>
    </div>
  </div>
</section>

<script>
/* ---- status ---- */
var visus = 'pipata';          /* pipata | articuli | articulus | editor | res */
var articulus_id = null;       /* articulus apertus */
var editor_res = null;         /* null = novus */
var ultima = {};               /* series-differentiae per visum */
var erroris = document.getElementById('nuntius-erroris');
/* genera (G2): sub-status intra visum 'res' */
var res_visus = 'index';       /* index | creator | tabula | ens | forma */
var res_defs = [];             /* definitiones (cache) */
var res_def = null;            /* definitio generis aperti */
var res_entia = [];            /* entia generis aperti (cache) */
var res_commentaria = [];      /* commentaria (visus entis) */
var res_ens_id = null;         /* ens apertum */
var res_ordinatio = {};        /* clavis generis -> {campus, typus, directio} */
var res_fts_ids = null;        /* null = sine filtro; aliter [] res_id */
var forma_res = null;          /* null = novum; aliter ens editum */
var forma_nexus = {};          /* clavis campi -> [{id, titulus}] selecta */
var forma_nexus_prior = {};    /* prior (editio) pro diff denexus/nexus */
var forma_scopi = {};          /* clavis campi relatio -> entia destinationis */

function codicilli(s) { return Array.from(s).length; }

function culpam_ostendere(c, ordinarius) {
  erroris.textContent = (c && c.nuntius) || ordinarius;
}

function subscriptio(p) {
  if (p.datum && p.datum.signatura) { return p.datum.signatura; }
  if (p.actor === 'fran') { return 'Fran'; }
  return p.actor || 'ignotus';
}

function tempus_breve(p) {
  return (p.creatum || '').slice(0, 16).replace('T', ' ');
}

/* focus in arca inter tabulam? redditio omissa ne perdatur
 * (INPUT quoque - arca FTS tabularum sub anquisitione vivit) */
function arca_activa() {
  var a = document.activeElement;
  return a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')
    && a.dataset.inter === 'verum';
}

/* ---- visus vertere ---- */
function vertere(novus) {
  visus = novus;
  document.getElementById('visus-pipata').hidden = novus !== 'pipata';
  document.getElementById('visus-articuli').hidden = novus !== 'articuli';
  document.getElementById('visus-articulus').hidden = novus !== 'articulus';
  document.getElementById('visus-editor').hidden = novus !== 'editor';
  document.getElementById('visus-res').hidden = novus !== 'res';
  document.getElementById('nav-pipata').className =
    (novus === 'pipata') ? 'activa' : '';
  document.getElementById('nav-articuli').className =
    (novus !== 'pipata' && novus !== 'res') ? 'activa' : '';
  document.getElementById('nav-res').className =
    (novus === 'res') ? 'activa' : '';
  erroris.textContent = '';
  ultima = {};
  anquirere();
}
document.getElementById('nav-pipata').onclick = function () { vertere('pipata'); };
document.getElementById('nav-articuli').onclick = function () { vertere('articuli'); };
document.getElementById('nav-res').onclick = function () { res_vertere('index'); vertere('res'); };
document.getElementById('retro-articuli').onclick = function () { vertere('articuli'); };

/* ---- arca responsi in linea (pipata + commentaria) ---- */
function arcam_responsi_facere(genus, ad, limes) {
  var domus = document.createElement('div');
  domus.className = 'arca-responsi';
  var ta = document.createElement('textarea');
  ta.rows = 2;
  ta.placeholder = 'responsum...';
  ta.dataset.inter = 'verum';
  var pes = document.createElement('div');
  pes.id = '';
  pes.style.display = 'flex';
  pes.style.justifyContent = 'space-between';
  pes.style.marginTop = '.3em';
  var num = document.createElement('span');
  num.className = 'numerator';
  num.textContent = limes ? '0 / ' + limes : '';
  var b = document.createElement('button');
  b.className = 'parva';
  b.textContent = 'mittere';
  ta.addEventListener('input', function () {
    if (limes) {
      var n = codicilli(ta.value);
      num.textContent = n + ' / ' + limes;
      num.className = n > limes ? 'numerator nimius' : 'numerator';
      b.disabled = n === 0 || n > limes;
    }
  });
  b.onclick = function () {
    if (!ta.value) { return; }
    b.disabled = true;
    internuntius.vocare('mittere', { genus: genus, corpus: ta.value, ad: ad })
      .then(function () { domus.remove(); anquirere_nunc(); })
      .catch(function (c) { culpam_ostendere(c, 'defectus missionis'); b.disabled = false; });
  };
  pes.appendChild(num);
  pes.appendChild(b);
  domus.appendChild(ta);
  domus.appendChild(pes);
  return domus;
}

function actionem_facere(titulus, ago) {
  var a = document.createElement('a');
  a.className = 'actio';
  a.textContent = titulus;
  a.onclick = ago;
  return a;
}

/* ---- pipata ---- */
function elementum_pipati(p, filii) {
  var div = document.createElement('div');
  div.className = 'pipatum';
  var caput = document.createElement('div');
  var quis = document.createElement('span');
  quis.className = 'subscriptio';
  quis.textContent = '— ' + subscriptio(p);
  var quando = document.createElement('span');
  quando.className = 'tempus';
  quando.textContent = '  ' + tempus_breve(p);
  caput.appendChild(quis);
  caput.appendChild(quando);
  var corpus = document.createElement('div');
  corpus.className = 'corpus';
  corpus.textContent = (p.datum && p.datum.corpus) || p.titulus || '';
  div.appendChild(caput);
  div.appendChild(corpus);
  var act = document.createElement('div');
  act.className = 'actiones';
  act.appendChild(actionem_facere('respondere', function () {
    if (div.querySelector('.arca-responsi')) { return; }
    div.appendChild(arcam_responsi_facere('pipatum', p.res_id, 240));
  }));
  div.appendChild(act);
  var responsa = filii[p.res_id];
  if (responsa && responsa.length) {
    var arbor = document.createElement('div');
    arbor.className = 'responsa';
    responsa.slice().reverse().forEach(function (r) {
      arbor.appendChild(elementum_pipati(r, filii));
    });
    div.appendChild(arbor);
  }
  return div;
}

function reddere_pipata(pipata) {
  var tabula = document.getElementById('tabula');
  var per_id = {}, radices = [], filii = {};
  tabula.innerHTML = '';
  pipata.forEach(function (p) { per_id[p.res_id] = p; });
  pipata.forEach(function (p) {
    if (p.respondet_ad && per_id[p.respondet_ad]) {
      (filii[p.respondet_ad] = filii[p.respondet_ad] || []).push(p);
    } else { radices.push(p); }
  });
  radices.forEach(function (p) { tabula.appendChild(elementum_pipati(p, filii)); });
  document.getElementById('vacuum').hidden = pipata.length > 0;
}

/* ---- articuli: index ---- */
function reddere_indicem(articuli) {
  var index = document.getElementById('index-articulorum');
  index.innerHTML = '';
  articuli.forEach(function (a) {
    var ordo = document.createElement('div');
    ordo.className = 'ordo-articuli';
    var t = document.createElement('span');
    t.textContent = (a.datum && a.datum.titulus) || a.titulus;
    var latus = document.createElement('span');
    var sig = document.createElement('span');
    sig.className = 'sigillum ' + (a.status || '');
    sig.textContent = a.status || '?';
    var quando = document.createElement('span');
    quando.className = 'tempus';
    quando.textContent = '  ' + tempus_breve(a);
    latus.appendChild(sig);
    latus.appendChild(quando);
    ordo.appendChild(t);
    ordo.appendChild(latus);
    ordo.onclick = function () { aperire_articulum(a.res_id); };
    index.appendChild(ordo);
  });
  document.getElementById('vacuum-articuli').hidden = articuli.length > 0;
}

/* ---- articulus unus + filum ---- */
function aperire_articulum(id) {
  articulus_id = id;
  vertere('articulus');
}

function elementum_commentarii(c, filii) {
  var habet_filios = !!(filii[c.res_id] && filii[c.res_id].length);
  var remotum = !(c.datum && c.datum.corpus);
  if (remotum && !habet_filios) { return null; }
  var div = document.createElement('div');
  div.className = 'commentarium';
  var caput = document.createElement('div');
  var quis = document.createElement('span');
  quis.className = 'subscriptio';
  quis.textContent = '— ' + subscriptio(c);
  var quando = document.createElement('span');
  quando.className = 'tempus';
  quando.textContent = '  ' + tempus_breve(c);
  caput.appendChild(quis);
  caput.appendChild(quando);
  div.appendChild(caput);
  if (remotum) {
    var r = document.createElement('div');
    r.className = 'remotum';
    r.textContent = '[remotum]';
    div.appendChild(r);
  } else {
    var corpus = document.createElement('div');
    corpus.className = 'corpus';
    corpus.textContent = c.datum.corpus;
    div.appendChild(corpus);
    var act = document.createElement('div');
    act.className = 'actiones';
    act.appendChild(actionem_facere('respondere', function () {
      if (div.querySelector('.arca-responsi')) { return; }
      div.appendChild(arcam_responsi_facere('commentarium', c.res_id, 0));
    }));
    act.appendChild(actionem_facere('recensere', function () {
      if (div.querySelector('.arca-responsi')) { return; }
      var arca = arcam_responsi_facere('', '', 0);
      var ta = arca.querySelector('textarea');
      var b = arca.querySelector('button');
      ta.value = c.datum.corpus;
      b.textContent = 'servare';
      b.onclick = function () {
        if (!ta.value) { return; }
        b.disabled = true;
        internuntius.vocare('mutare', { res_id: c.res_id, corpus: ta.value })
          .then(function () { arca.remove(); anquirere_nunc(); })
          .catch(function (cc) { culpam_ostendere(cc, 'defectus editionis'); b.disabled = false; });
      };
      div.appendChild(arca);
    }));
    act.appendChild(actionem_facere('delere', function () {
      internuntius.vocare('delere', { res_id: c.res_id })
        .then(anquirere_nunc)
        .catch(function (cc) { culpam_ostendere(cc, 'defectus deletionis'); });
    }));
    div.appendChild(act);
  }
  if (habet_filios) {
    var arbor = document.createElement('div');
    arbor.className = 'responsa';
    filii[c.res_id].slice().reverse().forEach(function (f) {
      var e = elementum_commentarii(f, filii);
      if (e) { arbor.appendChild(e); }
    });
    div.appendChild(arbor);
  }
  return div;
}

function reddere_articulum(articuli, commentaria) {
  var arti = null;
  articuli.forEach(function (a) { if (a.res_id === articulus_id) { arti = a; } });
  var caput = document.getElementById('articulus-caput');
  var corpus_div = document.getElementById('articulus-corpus');
  var filum = document.getElementById('filum');
  caput.innerHTML = '';
  corpus_div.innerHTML = '';
  filum.innerHTML = '';
  if (!arti) {
    caput.textContent = 'articulus non inventus';
    return;
  }
  var h = document.createElement('h2');
  h.textContent = (arti.datum && arti.datum.titulus) || arti.titulus;
  caput.appendChild(h);
  var barra = document.createElement('div');
  barra.className = 'caput-actionum';
  var sig = document.createElement('span');
  sig.className = 'sigillum ' + (arti.status || '');
  sig.textContent = arti.status || '?';
  barra.appendChild(sig);
  var quis = document.createElement('span');
  quis.className = 'tempus';
  quis.textContent = subscriptio(arti) + ' · ' + tempus_breve(arti);
  barra.appendChild(quis);
  function butonem(titulus, novus) {
    var b = document.createElement('button');
    b.className = 'parva';
    b.textContent = titulus;
    b.onclick = function () {
      internuntius.vocare('status_ponere', { res_id: arti.res_id, novus: novus })
        .then(anquirere_nunc)
        .catch(function (c) { culpam_ostendere(c, 'defectus statūs'); });
    };
    return b;
  }
  if (arti.status === 'conditum') { barra.appendChild(butonem('publicare', 'publicatum')); }
  if (arti.status === 'publicatum') { barra.appendChild(butonem('retractare', 'retractum')); }
  var rec = document.createElement('button');
  rec.className = 'parva';
  rec.textContent = 'recensere';
  rec.onclick = function () {
    editor_res = arti.res_id;
    document.getElementById('editor-titulus').value =
      (arti.datum && arti.datum.titulus) || arti.titulus;
    document.getElementById('editor-corpus').value =
      (arti.datum && arti.datum.corpus) || '';
    vertere('editor');
  };
  barra.appendChild(rec);
  caput.appendChild(barra);
  var textus = (arti.datum && arti.datum.corpus) || '';
  textus.split(/\n\s*\n/).forEach(function (par) {
    if (!par.trim()) { return; }
    var p = document.createElement('p');
    p.textContent = par;
    corpus_div.appendChild(p);
  });
  /* filum: radices = commentaria quae articulo respondent */
  var per_id = {}, filii = {}, radices = [];
  commentaria.forEach(function (c) { per_id[c.res_id] = c; });
  commentaria.forEach(function (c) {
    if (c.respondet_ad === articulus_id) { radices.push(c); }
    else if (c.respondet_ad && per_id[c.respondet_ad]) {
      (filii[c.respondet_ad] = filii[c.respondet_ad] || []).push(c);
    }
  });
  radices.slice().reverse().forEach(function (c) {
    var e = elementum_commentarii(c, filii);
    if (e) { filum.appendChild(e); }
  });
}

/* ==================================================
 * genera per app definita (G2)

/* instrumentum daemonis directum (tractator transmittere -
 * allowlist C-latere, actor fran iniectus) */
function instrumentum(nomen, argumenta) {
  return internuntius.vocare('transmittere',
    { instrumentum: nomen, argumenta: argumenta });
}

function clavicare(s) {
  return s.toLowerCase().replace(/\s+/g, '_')
    .replace(/[^a-z0-9_]/g, '');
}

function annus_monstrare(v) {
  if (v === null || v === undefined || v === '') { return ''; }
  return v < 0 ? (-v) + ' a.C.n.' : String(v);
}

function def_schema(d) { return (d && d.datum) || {}; }
function campi_de(d) { return def_schema(d).campi || []; }
function clavis_de(d) { return def_schema(d).clavis || ''; }
function titulus_de(d) {
  return def_schema(d).titulus_monstrans || d.titulus || '?';
}
function campus_tituli_de(d) {
  var ct = def_schema(d).campus_tituli;
  if (ct) { return ct; }
  var primus = null;
  campi_de(d).forEach(function (c) {
    if (!primus && (c.typus === 'textus' || c.typus === 'area')) {
      primus = c.clavis;
    }
  });
  return primus;
}
function campum_de(d, clavis) {
  var inventum = null;
  campi_de(d).forEach(function (c) {
    if (c.clavis === clavis) { inventum = c; }
  });
  return inventum;
}
function tumulus_est(e) {
  return !(e.datum && e.datum.titulus);
}
var CLAVES_SYSTEMATIS = ['genus', 'titulus', 'corpus', 'tags',
  'ancorae', 'signatura', 'status', 'notae'];
/* speculum IS iudicii machinae: ens extra specem generis?
 * (orphani post emendationem schematis - signum reparationis) */
function ens_extra_specem(def, e) {
  if (!e.datum) { return false; }
  var malum = false;
  Object.keys(e.datum).forEach(function (k) {
    if (CLAVES_SYSTEMATIS.indexOf(k) >= 0) { return; }
    var c = campum_de(def, k);
    if (!c) { malum = true; return; }
    var v = e.datum[k];
    if ((c.typus === 'textus' || c.typus === 'area'
         || c.typus === 'dies') && typeof v !== 'string') { malum = true; }
    if ((c.typus === 'annus' || c.typus === 'numerus')
        && typeof v !== 'number') { malum = true; }
    if (c.typus === 'veritas' && typeof v !== 'boolean') { malum = true; }
    if (c.typus === 'electio' && (typeof v !== 'string'
        || (c.optiones || []).indexOf(v) < 0)) { malum = true; }
    if (c.typus === 'relatio') { malum = true; }
  });
  return malum;
}
function nexus_de(e, clavis) {
  return (e.nexus || []).filter(function (n) {
    return n.verbum === clavis;
  });
}

/* sub-visus intra 'res' */
function res_vertere(sub) {
  res_visus = sub;
  document.getElementById('res-index-domus').hidden = sub !== 'index';
  document.getElementById('res-creator-domus').hidden = sub !== 'creator';
  document.getElementById('res-tabula-domus').hidden = sub !== 'tabula';
  document.getElementById('res-ens-domus').hidden = sub !== 'ens';
  document.getElementById('res-forma-domus').hidden = sub !== 'forma';
  erroris.textContent = '';
  ultima = {};
  if (sub === 'index' || sub === 'tabula' || sub === 'ens') { anquirere(); }
}

document.getElementById('ens-retro').onclick = function () { res_vertere('tabula'); };

/* ---- creator generis ---- */
var creator_ordines = [];   /* ordines camporum vivi in DOM */

function creator_optiones_renovare() {
  var ct = document.getElementById('creator-campus-tituli');
  var oc = document.getElementById('creator-ordo-campus');
  var ct_prior = ct.value, oc_prior = oc.value;
  ct.innerHTML = ''; oc.innerHTML = '';
  var nulla = document.createElement('option');
  nulla.value = ''; nulla.textContent = '(nullus)';
  oc.appendChild(nulla);
  creator_ordines.forEach(function (o) {
    var clavis = clavicare(o.monstrans.value);
    if (!clavis) { return; }
    if (o.typus.value === 'textus' || o.typus.value === 'area') {
      var op = document.createElement('option');
      op.value = clavis; op.textContent = clavis;
      ct.appendChild(op);
    }
    if (o.typus.value !== 'relatio') {
      var op2 = document.createElement('option');
      op2.value = clavis; op2.textContent = clavis;
      oc.appendChild(op2);
    }
  });
  if (ct_prior) { ct.value = ct_prior; }
  if (oc_prior) { oc.value = oc_prior; }
}

function creator_ordinem_addere(campo) {
  var domus = document.getElementById('creator-campi');
  var ordo = document.createElement('div');
  ordo.className = 'ordo-campi';
  var monstrans = document.createElement('input');
  monstrans.placeholder = 'campus (e.g. Annus editionis)';
  var typus = document.createElement('select');
  ['textus', 'area', 'dies', 'annus', 'numerus', 'veritas',
   'electio', 'relatio']
    .forEach(function (t) {
      var op = document.createElement('option');
      op.value = t; op.textContent = t;
      typus.appendChild(op);
    });
  var optiones = document.createElement('input');
  optiones.placeholder = 'optio una, altera, tertia';
  optiones.title = 'optiones commatibus separatae - ordo = ordo'
    + ' indicis et ordinationis';
  optiones.hidden = true;
  var ad = document.createElement('select');
  ad.hidden = true;
  res_defs.forEach(function (d) {
    var op = document.createElement('option');
    op.value = clavis_de(d); op.textContent = clavis_de(d);
    ad.appendChild(op);
  });
  var card = document.createElement('select');
  card.hidden = true;
  ['unum', 'multa'].forEach(function (c) {
    var op = document.createElement('option');
    op.value = c; op.textContent = c;
    card.appendChild(op);
  });
  typus.onchange = function () {
    ad.hidden = typus.value !== 'relatio';
    card.hidden = typus.value !== 'relatio';
    optiones.hidden = typus.value !== 'electio';
    creator_optiones_renovare();
  };
  monstrans.addEventListener('input', creator_optiones_renovare);
  var x = document.createElement('a');
  x.textContent = '×';
  x.onclick = function () {
    ordo.remove();
    creator_ordines = creator_ordines.filter(function (o) {
      return o.ordo !== ordo;
    });
    creator_optiones_renovare();
  };
  if (campo) {
    monstrans.value = campo.monstrans || campo.clavis;
    typus.value = campo.typus || 'textus';
    if (campo.ad) { ad.value = campo.ad; }
    if (campo.cardinalitas) { card.value = campo.cardinalitas; }
    if (campo.optiones) { optiones.value = campo.optiones.join(', '); }
    ad.hidden = typus.value !== 'relatio';
    card.hidden = typus.value !== 'relatio';
    optiones.hidden = typus.value !== 'electio';
  }
  ordo.appendChild(monstrans);
  ordo.appendChild(typus);
  ordo.appendChild(ad);
  ordo.appendChild(card);
  ordo.appendChild(optiones);
  ordo.appendChild(x);
  domus.appendChild(ordo);
  creator_ordines.push({ ordo: ordo, monstrans: monstrans,
    typus: typus, ad: ad, card: card, optiones: optiones,
    orig: campo ? campo.clavis : null });
}

var creator_res = null;   /* null = genus novum; aliter definitio edita */

function creator_aperire(def) {
  creator_res = def;
  document.getElementById('creator-titulus').value =
    def ? (def_schema(def).titulus_monstrans || def.titulus) : '';
  document.getElementById('creator-clavis').textContent = def
    ? 'clavis: ' + clavis_de(def) + ' (immutabilis)'
    : 'clavis: —';
  document.querySelector('#res-creator-domus h2').textContent =
    def ? ('genus recensere: ' + titulus_de(def)) : 'genus novum';
  document.getElementById('creator-campi').innerHTML = '';
  creator_ordines = [];
  if (def) {
    campi_de(def).forEach(function (c) { creator_ordinem_addere(c); });
  } else {
    creator_ordinem_addere();
  }
  creator_optiones_renovare();
  if (def) {
    var s = def_schema(def);
    if (s.campus_tituli) {
      document.getElementById('creator-campus-tituli').value =
        s.campus_tituli;
    }
    document.getElementById('creator-ordo-campus').value =
      s.ordo_ordinarius ? (s.ordo_ordinarius.campus || '') : '';
    document.getElementById('creator-ordo-directio').value =
      s.ordo_ordinarius ? (s.ordo_ordinarius.directio || 'ascendens')
        : 'ascendens';
  }
  res_vertere('creator');
}

document.getElementById('genus-novum').onclick = function () {
  creator_aperire(null);
};
document.getElementById('genus-recensere').onclick = function () {
  creator_aperire(res_def);
};
document.getElementById('creator-campum-addere').onclick =
  function () { creator_ordinem_addere(); };
document.getElementById('creator-titulus').addEventListener('input',
  function () {
    if (creator_res) { return; }   /* clavis fixa in editione */
    var c = clavicare(this.value);
    document.getElementById('creator-clavis').textContent =
      'clavis: ' + (c || '—') + ' (immutabilis post creationem)';
  });

/* emendatio generis + migratio renominationum (G2.2): mutatio
 * definitionis, claves optionales sublatae remotae (mersio
 * superficialis non delet), deinde per ens eventus honesti
 * (mutatio clavis novae + remotio veteris). Communis servatori et
 * fumo. */
function genus_emendare(def, schema, renominationes, entia) {
  var mersio = { titulus_monstrans: schema.titulus_monstrans,
    campi: schema.campi };
  if (schema.campus_tituli) { mersio.campus_tituli = schema.campus_tituli; }
  if (schema.ordo_ordinarius) { mersio.ordo_ordinarius = schema.ordo_ordinarius; }
  var catena = instrumentum('gerere', { res: def.res_id,
    actus: 'mutatio', datum: JSON.stringify(mersio) });
  var s_vetus = def_schema(def);
  ['campus_tituli', 'ordo_ordinarius'].forEach(function (k) {
    if (s_vetus[k] && !schema[k]) {
      catena = catena.then(function () {
        return instrumentum('gerere', { res: def.res_id,
          actus: 'remotio', clavis: k });
      });
    }
  });
  (renominationes || []).forEach(function (rn) {
    (entia || []).forEach(function (e) {
      if (!e.datum || e.datum[rn.vetus] === undefined) { return; }
      var m = {};
      m[rn.novus] = e.datum[rn.vetus];
      catena = catena.then(function () {
        return instrumentum('gerere', { res: e.res_id,
          actus: 'mutatio', datum: JSON.stringify(m) });
      }).then(function () {
        return instrumentum('gerere', { res: e.res_id,
          actus: 'remotio', clavis: rn.vetus });
      });
    });
  });
  return catena;
}

document.getElementById('creator-servare').onclick = function () {
  var titulus = document.getElementById('creator-titulus').value;
  var clavis = creator_res ? clavis_de(creator_res)
    : clavicare(titulus);
  if (!clavis || !titulus) { culpam_ostendere(null, 'titulus generis requiritur'); return; }
  var campi = [];
  var pravum = null;
  creator_ordines.forEach(function (o) {
    var ck = clavicare(o.monstrans.value);
    if (!ck) { return; }
    var campus = { clavis: ck, monstrans: o.monstrans.value,
      typus: o.typus.value };
    if (o.typus.value === 'relatio') {
      if (!o.ad.value) { pravum = 'relatio sine genere destinationis'; return; }
      campus.ad = o.ad.value;
      campus.cardinalitas = o.card.value;
    }
    if (o.typus.value === 'electio') {
      var ops = o.optiones.value.split(',')
        .map(function (s) { return s.trim(); })
        .filter(function (s) { return s.length > 0; });
      if (!ops.length) { pravum = 'electio sine optionibus'; return; }
      campus.optiones = ops;
    }
    campi.push(campus);
  });
  if (pravum) { culpam_ostendere(null, pravum); return; }
  if (!campi.length) { culpam_ostendere(null, 'campus saltem unus requiritur'); return; }
  var schema = { clavis: clavis, titulus_monstrans: titulus, campi: campi };
  var ct = document.getElementById('creator-campus-tituli').value;
  if (ct) { schema.campus_tituli = ct; }
  var oc = document.getElementById('creator-ordo-campus').value;
  if (oc) {
    schema.ordo_ordinarius = { campus: oc,
      directio: document.getElementById('creator-ordo-directio').value };
  }
  if (!creator_res) {
    instrumentum('addere', { genus: 'definitio', titulus: titulus,
      datum: JSON.stringify(schema) })
      .then(function () { res_vertere('index'); })
      .catch(function (c) { culpam_ostendere(c, 'defectus creationis generis'); });
    return;
  }
  /* editio: renominationes ex ordinibus (orig != clavis nova) */
  {
    var renominationes = [];
    creator_ordines.forEach(function (o) {
      var ck = clavicare(o.monstrans.value);
      if (o.orig && ck && ck !== o.orig) {
        renominationes.push({ vetus: o.orig, novus: ck });
      }
    });
    genus_emendare(creator_res, schema, renominationes, res_entia)
      .then(function () { res_vertere('tabula'); anquirere_nunc(); })
      .catch(function (c) { culpam_ostendere(c, 'defectus emendationis generis'); });
  }
};

/* ---- tabula entium ---- */
function columnas_de(def) {
  var ct = campus_tituli_de(def);
  var columnae = [];
  var tituli_campus = campum_de(def, ct);
  columnae.push({ clavis: ct, monstrans: (tituli_campus
    && tituli_campus.monstrans) || 'titulus',
    typus: (tituli_campus && tituli_campus.typus) || 'textus' });
  campi_de(def).forEach(function (c) {
    if (c.clavis === ct) { return; }
    columnae.push(c);
  });
  return columnae;
}

function valorem_ordinis(e, col) {
  if (col.typus === 'relatio') {
    var tituli = nexus_de(e, col.clavis).map(function (n) {
      return n.ad_titulus || '[deletum]';
    });
    return tituli.join(', ');
  }
  var v = e.datum ? e.datum[col.clavis] : undefined;
  if (v === undefined || v === null) { return ''; }
  if (col.typus === 'annus') { return annus_monstrare(v); }
  if (col.typus === 'veritas') { return v === true ? '✓' : '—'; }
  return String(v);
}

function claves_ordinationis(e, col) {
  var v = e.datum ? e.datum[col.clavis] : undefined;
  if (col.typus === 'annus' || col.typus === 'numerus') {
    return (typeof v === 'number') ? v : Infinity;
  }
  if (col.typus === 'veritas') {
    return v === true ? 2 : (v === false ? 1 : 0);
  }
  if (col.typus === 'electio') {
    /* ordo definitionis = ordo verus (desideratus < possessus <
     * lectus), non alphabeticus; absens ultimus */
    var idx = (col.optiones || []).indexOf(v);
    return idx < 0 ? Infinity : idx;
  }
  return valorem_ordinis(e, col).toLowerCase();
}

function reddere_res_tabulam() {
  var continens = document.getElementById('res-tabula-continens');
  var def = res_def;
  var columnae = columnas_de(def);
  var gc = clavis_de(def);
  var ordinatio = res_ordinatio[gc]
    || (def_schema(def).ordo_ordinarius
        ? { campus: def_schema(def).ordo_ordinarius.campus,
            directio: def_schema(def).ordo_ordinarius.directio }
        : null);
  var entia = res_entia.filter(function (e) {
    if (tumulus_est(e)) { return false; }
    if (res_fts_ids && res_fts_ids.indexOf(e.res_id) < 0) { return false; }
    return true;
  });
  if (ordinatio) {
    var col = null;
    columnae.forEach(function (c) {
      if (c.clavis === ordinatio.campus) { col = c; }
    });
    if (col) {
      entia = entia.slice().sort(function (a, b) {
        var ka = claves_ordinationis(a, col);
        var kb = claves_ordinationis(b, col);
        var d = (ka < kb) ? -1 : (ka > kb ? 1 : 0);
        return ordinatio.directio === 'descendens' ? -d : d;
      });
    }
  }
  continens.innerHTML = '';
  var tabula = document.createElement('table');
  tabula.className = 'res';
  var thead = document.createElement('thead');
  var tr = document.createElement('tr');
  columnae.forEach(function (c) {

/* ---- visus entis + porticus inversa ---- */
function reddere_res_ens() {
  var domus = document.getElementById('res-ens');
  var ens = null;
  res_entia.forEach(function (e) {
    if (e.res_id === res_ens_id) { ens = e; }
  });
  domus.innerHTML = '';
  if (!ens) { domus.textContent = 'ens non inventum'; return; }
  var h = document.createElement('h2');
  h.textContent = tumulus_est(ens) ? '[deletum]'
    : ((ens.datum && ens.datum.titulus) || ens.titulus);
  if (ens_extra_specem(res_def, ens)) {
    var sig_e = document.createElement('span');
    sig_e.className = 'extra-specem';
    sig_e.textContent = ' ⚠ extra specem';
    sig_e.style.fontSize = '.6em';
    h.appendChild(sig_e);
  }
  domus.appendChild(h);
  var barra = document.createElement('div');
  barra.className = 'caput-actionum';
  var quando = document.createElement('span');
  quando.className = 'tempus';
  quando.textContent = subscriptio(ens) + ' · ' + tempus_breve(ens);
  barra.appendChild(quando);
  if (!tumulus_est(ens)) {
    var rec = document.createElement('button');
    rec.className = 'parva';
    rec.textContent = 'recensere';
    rec.onclick = function () { forma_aperire(ens); };
    barra.appendChild(rec);
    var del = document.createElement('button');
    del.className = 'parva';
    del.textContent = 'delere';
    del.onclick = function () {
      instrumentum('gerere', { res: ens.res_id, actus: 'remotio',
        clavis: 'titulus' })
        .then(function () { res_vertere('tabula'); anquirere_nunc(); })
        .catch(function (c) { culpam_ostendere(c, 'defectus deletionis'); });
    };
    barra.appendChild(del);
  }
  domus.appendChild(barra);
  campi_de(res_def).forEach(function (c) {
    var div = document.createElement('div');
    div.className = 'valor-entis';
    var lab = document.createElement('div');
    lab.className = 'titulus-campi';
    lab.textContent = c.monstrans || c.clavis;
    div.appendChild(lab);
    var val = document.createElement('div');
    if (c.typus === 'relatio') {
      var nn = nexus_de(ens, c.clavis);
      if (!nn.length) { val.className = 'tempus'; val.textContent = '—'; }
      nn.forEach(function (n) {
        var sp = document.createElement('span');
        sp.className = n.ad_titulus ? 'chip' : 'remotum';
        sp.textContent = n.ad_titulus || '[deletum]';
        val.appendChild(sp);
      });
    } else {
      var v = ens.datum ? ens.datum[c.clavis] : undefined;
      if (c.typus === 'annus') { val.textContent = annus_monstrare(v); }
      else if (c.typus === 'veritas') {
        val.textContent = v === true ? '✓'
          : (v === false ? '—' : '');
      }
      else { val.textContent =
        (v === undefined || v === null) ? '' : String(v); }
      if (c.typus === 'area') { val.className = 'corpus'; }
    }
    div.appendChild(val);
    domus.appendChild(div);
  });
  var tags = (ens.datum && ens.datum.tags) || [];
  if (tags.length) {
    var tdiv = document.createElement('div');
    tdiv.className = 'valor-entis';
    var tlab = document.createElement('div');
    tlab.className = 'titulus-campi';
    tlab.textContent = 'tags';
    tdiv.appendChild(tlab);
    tags.forEach(function (t) {
      var sp = document.createElement('span');
      sp.className = 'chip';
      sp.textContent = t;
      tdiv.appendChild(sp);
    });
    domus.appendChild(tdiv);
  }
  /* porticus inversa: quis huc monstrat (per genus monstrans) */
  var monstrantia = [];
  res_defs.forEach(function (d) {
    campi_de(d).forEach(function (c) {
      if (c.typus === 'relatio' && c.ad === clavis_de(res_def)) {
        monstrantia.push({ def: d, campus: c });
      }
    });
  });
  if (monstrantia.length) {
    var port = document.createElement('div');
    port.className = 'porticus';
    var h3 = document.createElement('h3');
    h3.textContent = 'huc monstrant';
    port.appendChild(h3);
    monstrantia.forEach(function (m) {
      legere(clavis_de(m.def)).then(function (entia) {
        entia.forEach(function (e) {
          var acti = nexus_de(e, m.campus.clavis)
            .some(function (n) { return n.ad === res_ens_id; });
          if (!acti) { return; }
          var a = document.createElement('a');
          a.textContent = titulus_de(m.def) + ': '
            + ((e.datum && e.datum.titulus) || '[deletum]');
          a.onclick = function () {
            res_def = m.def;
            res_entia = entia;
            res_ens_id = e.res_id;
            document.getElementById('tabula-titulus').textContent =
              titulus_de(m.def);
            res_vertere('ens');
          };
          port.appendChild(a);
        });
      });
    });
    domus.appendChild(port);
  }
  /* commentaria de ente: idem motor fili quo articuli (radices =
   * respondet_ad === ens; discursus de datis - epistulae Claudii) */
  {
    var per_id_c = {}, filii_c = {}, radices_c = [];
    res_commentaria.forEach(function (c) { per_id_c[c.res_id] = c; });
    res_commentaria.forEach(function (c) {
      if (c.respondet_ad === res_ens_id) { radices_c.push(c); }
      else if (c.respondet_ad && per_id_c[c.respondet_ad]) {
        (filii_c[c.respondet_ad] = filii_c[c.respondet_ad] || []).push(c);
      }
    });
    if (radices_c.length) {
      var cdiv = document.createElement('div');
      cdiv.className = 'porticus';
      var h3c = document.createElement('h3');
      h3c.textContent = 'commentaria';
      cdiv.appendChild(h3c);
      radices_c.slice().reverse().forEach(function (c) {
        var e = elementum_commentarii(c, filii_c);
        if (e) { cdiv.appendChild(e); }
      });
      domus.appendChild(cdiv);
    }
  }
}

/* ---- forma entis (poll-exempta; exemplar editoris) ---- */
var forma_latitudines = {};   /* clavis campi -> elementum valoris */

function selector_relationis(campus, praeselecta) {
  var domus = document.createElement('div');
  domus.className = 'praebita';
  var chips = document.createElement('div');
  var arca = document.createElement('input');
  arca.placeholder = 'quaerere ' + campus.ad + '...';
  var index = document.createElement('div');
  index.className = 'praebita-index';
  index.hidden = true;
  forma_nexus[campus.clavis] = (praeselecta || []).slice();

  function chips_reddere() {
    chips.innerHTML = '';
    forma_nexus[campus.clavis].forEach(function (sel) {
      var sp = document.createElement('span');
      sp.className = 'chip';
      sp.textContent = sel.titulus;
      var x = document.createElement('a');
      x.textContent = '×';
      x.onclick = function () {
        forma_nexus[campus.clavis] =
          forma_nexus[campus.clavis].filter(function (s) {
            return s.id !== sel.id;
          });
        chips_reddere();
      };
      sp.appendChild(x);
      chips.appendChild(sp);
    });
  }

  function seligere(id, titulus) {
    if (campus.cardinalitas === 'unum') {
      forma_nexus[campus.clavis] = [{ id: id, titulus: titulus }];
    } else {
      var iam = forma_nexus[campus.clavis].some(function (s) {
        return s.id === id;
      });
      if (!iam) {
        forma_nexus[campus.clavis].push({ id: id, titulus: titulus });
      }
    }
    arca.value = '';
    index.hidden = true;
    chips_reddere();
  }

  arca.addEventListener('input', function () {
    var q = arca.value.toLowerCase();
    index.innerHTML = '';
    if (!q) { index.hidden = true; return; }
    var scopi = forma_scopi[campus.clavis] || [];
    scopi.forEach(function (e) {
      if (tumulus_est(e)) { return; }
      var t = (e.datum && e.datum.titulus) || '';
      if (t.toLowerCase().indexOf(q) < 0) { return; }
      var d = document.createElement('div');
      d.textContent = t;
      d.onclick = function () { seligere(e.res_id, t); };
      index.appendChild(d);
    });
    var creare = document.createElement('div');
    creare.className = 'creare-novum';
    creare.textContent = '+ creare «' + arca.value + '»';
    creare.onclick = function () {
      var t = arca.value;
      /* campus tituli generis destinationis QUOQUE impletur -
       * titulus machinae (indices/vincula) et campus schematis
       * (columna/forma) synchroni, ut forma servans facit */
      var def_ad = null;
      res_defs.forEach(function (d) {
        if (clavis_de(d) === campus.ad) { def_ad = d; }
      });
      var ct_ad = def_ad ? campus_tituli_de(def_ad) : null;
      var d_novum = {};
      if (ct_ad) { d_novum[ct_ad] = t; }
      instrumentum('addere', { genus: campus.ad, titulus: t,
        datum: JSON.stringify(d_novum) })
        .then(function (r) {
          if (r.res_id) {
            var e_novum = { res_id: r.res_id,
              datum: { titulus: t } };
            if (ct_ad) { e_novum.datum[ct_ad] = t; }
            forma_scopi[campus.clavis].push(e_novum);
            seligere(r.res_id, t);
          }
        })
        .catch(function (c) { culpam_ostendere(c, 'defectus creationis'); });
    };
    index.appendChild(creare);
    index.hidden = false;
  });
  chips_reddere();
  domus.appendChild(chips);
  domus.appendChild(arca);
  domus.appendChild(index);
  return domus;
}

function forma_aperire(ens) {
  forma_res = ens;
  forma_nexus = {};
  forma_nexus_prior = {};
  forma_scopi = {};
  forma_latitudines = {};
  document.getElementById('forma-caput').textContent =
    (ens ? 'recensere: ' : 'novum: ') + titulus_de(res_def);
  document.getElementById('forma-culpa').textContent = '';
  var domus = document.getElementById('res-forma');
  domus.innerHTML = '';
  var onera = [];
  campi_de(res_def).forEach(function (c) {
    var div = document.createElement('div');
    div.className = 'campus-formae';
    var lab = document.createElement('label');
    lab.textContent = (c.monstrans || c.clavis) + ' (' + c.typus + ')';
    div.appendChild(lab);
    if (c.typus === 'relatio') {
      var praeselecta = ens ? nexus_de(ens, c.clavis)
        .filter(function (n) { return n.ad_titulus; })
        .map(function (n) { return { id: n.ad, titulus: n.ad_titulus }; })
        : [];
      forma_nexus_prior[c.clavis] = praeselecta.slice();
      onera.push(legere(c.ad).then(function (entia) {
        forma_scopi[c.clavis] = entia;
      }).catch(function () { forma_scopi[c.clavis] = []; }));
      div.appendChild(selector_relationis(c, praeselecta));
    } else {
      var lat;
      if (c.typus === 'area') {
        lat = document.createElement('textarea');
        lat.rows = 4;
      } else if (c.typus === 'veritas') {
        lat = document.createElement('input');
        lat.type = 'checkbox';
        lat.style.width = 'auto';
      } else if (c.typus === 'electio') {
        lat = document.createElement('select');
        var vacua_op = document.createElement('option');
        vacua_op.value = ''; vacua_op.textContent = '—';
        lat.appendChild(vacua_op);
        (c.optiones || []).forEach(function (o) {
          var op = document.createElement('option');
          op.value = o; op.textContent = o;
          lat.appendChild(op);
        });
      } else {
        lat = document.createElement('input');
        if (c.typus === 'dies') { lat.placeholder = 'MMDCCLXXVI-07-04 => 1776-07-04'; }
        if (c.typus === 'annus') { lat.placeholder = 'negativus = a.C.n. (-753)'; }
      }
      var v = ens && ens.datum ? ens.datum[c.clavis] : undefined;
      if (c.typus === 'veritas') { lat.checked = v === true; }
      else if (v !== undefined && v !== null) { lat.value = String(v); }
      if (c.typus === 'annus') {
        var aera = document.createElement('span');
        aera.className = 'aera';
        var aeram_renovare = function () {
          var n = parseInt(lat.value, 10);
          aera.textContent = isNaN(n) ? '' : annus_monstrare(n);
        };
        lat.addEventListener('input', aeram_renovare);
        aeram_renovare();
        lab.appendChild(aera);
      }
      forma_latitudines[c.clavis] = lat;
      div.appendChild(lat);
    }
    domus.appendChild(div);
  });
  Promise.all(onera).then(function () { res_vertere('forma'); });
}

document.getElementById('forma-servare').onclick = function () {
  var def = res_def;
  var ct = campus_tituli_de(def);
  var datum = {};
  var pravum = null;
  campi_de(def).forEach(function (c) {
    if (c.typus === 'relatio') { return; }
    var lat = forma_latitudines[c.clavis];
    if (c.typus === 'veritas') {
      /* checkbox statum "absentem" exprimere nequit - semper
       * scriptum, non-signatum = false expressum */
      datum[c.clavis] = !!(lat && lat.checked);
      return;
    }
    var v = lat ? lat.value : '';
    if (v === '') {
      if (forma_res && forma_res.datum
          && forma_res.datum[c.clavis] !== undefined) {
        datum[c.clavis] = null;   /* vacuatum -> remotio post */
      }
      return;
    }
    if (c.typus === 'annus' || c.typus === 'numerus') {
      var n = parseInt(v, 10);
      if (isNaN(n) || String(n) !== v.trim()) {
        pravum = (c.monstrans || c.clavis) + ': integer requiritur';
        return;
      }
      datum[c.clavis] = n;
    } else {
      datum[c.clavis] = v;
    }
  });
  if (pravum) {
    document.getElementById('forma-culpa').textContent = pravum;
    return;
  }
  var titulus = ct && typeof datum[ct] === 'string' ? datum[ct] : '';
  if (!titulus) {
    document.getElementById('forma-culpa').textContent =
      'campus tituli (' + (ct || '?') + ') requiritur';
    return;
  }
  var remotiones = [];
  Object.keys(datum).forEach(function (k) {
    if (datum[k] === null) { remotiones.push(k); delete datum[k]; }
  });
  var promissum;
  var res_id_promissum;
  if (!forma_res) {
    promissum = instrumentum('addere', { genus: clavis_de(def),
      titulus: titulus, datum: JSON.stringify(datum) })
      .then(function (r) { res_id_promissum = r.res_id; });
  } else {
    res_id_promissum = forma_res.res_id;
    datum.titulus = titulus;
    promissum = instrumentum('gerere', { res: forma_res.res_id,
      actus: 'mutatio', datum: JSON.stringify(datum) });
  }
  promissum = promissum.then(function () {
    var catena = Promise.resolve();
    remotiones.forEach(function (k) {
      catena = catena.then(function () {
        return instrumentum('gerere', { res: res_id_promissum,
          actus: 'remotio', clavis: k });
      });
    });
    campi_de(def).forEach(function (c) {
      if (c.typus !== 'relatio') { return; }
      var nunc = forma_nexus[c.clavis] || [];
      var prior = forma_nexus_prior[c.clavis] || [];
      prior.forEach(function (p) {
        if (nunc.some(function (n) { return n.id === p.id; })) { return; }
        catena = catena.then(function () {
          return instrumentum('gerere', { res: res_id_promissum,
            actus: 'denexus', verbum: c.clavis, alterum: p.id });
        });
      });
      nunc.forEach(function (n) {
        if (prior.some(function (p) { return p.id === n.id; })) { return; }
        catena = catena.then(function () {
          return instrumentum('gerere', { res: res_id_promissum,
            actus: 'nexus', verbum: c.clavis, alterum: n.id });
        });
      });
    });
    return catena;
  });
  promissum.then(function () {
    res_ens_id = res_id_promissum;
    res_vertere(forma_res ? 'ens' : 'tabula');
    anquirere_nunc();
  }).catch(function (c) { culpam_ostendere(c, 'defectus servandi'); });
};

/* ---- anquisitio cum differentia ---- */
function legere(genus) {
  return internuntius.vocare('res_legere', { genus: genus })
    .then(function (r) { return r.res || []; });
}

function anquirere() {
  if (visus === 'editor') { return; }
  /* creator + forma = poll-exemptae (exemplar editoris - latitudines
   * vivae numquam a redditione clobberantur) */
  if (visus === 'res'
      && (res_visus === 'creator' || res_visus === 'forma')) { return; }
  if (arca_activa()) { return; }
  if (visus === 'res') {
    if (res_visus === 'index') {
      legere('definitio').then(function (defs) {
        res_defs = defs;
        return Promise.all(defs.map(function (d) {
          return legere(clavis_de(d)).then(function (e) {
            return e.filter(function (x) { return !tumulus_est(x); }).length;
          }).catch(function () { return 0; });
        })).then(function (numeri) {
          var series = JSON.stringify([defs, numeri]);
          erroris.textContent = '';
          if (series !== ultima.res_index) {
            ultima.res_index = series;
            reddere_res_indicem(defs, numeri);
          }
        });
      }).catch(function (c) { culpam_ostendere(c, 'defectus lectionis'); });
    } else if (res_visus === 'tabula' || res_visus === 'ens') {
      var onera_res = [legere('definitio'), legere(clavis_de(res_def))];
      if (res_visus === 'ens') { onera_res.push(legere('commentarium')); }
      Promise.all(onera_res)
        .then(function (ambo) {
          res_defs = ambo[0];
          res_entia = ambo[1];
          res_commentaria = ambo[2] || [];
          /* definitionem recentem retinere (emendationes adveniunt) */
          res_defs.forEach(function (d) {
            if (clavis_de(d) === clavis_de(res_def)) { res_def = d; }
          });
          var series = JSON.stringify(ambo) + '|' + res_visus + '|'
            + res_ens_id;
          erroris.textContent = '';
          if (series !== ultima.res_data) {
            ultima.res_data = series;
            if (res_visus === 'tabula') { reddere_res_tabulam(); }
            else { reddere_res_ens(); }
          }
        }).catch(function (c) { culpam_ostendere(c, 'defectus lectionis'); });
    }
    return;
  }
  if (visus === 'pipata') {
    legere('pipatum').then(function (pipata) {
      var series = JSON.stringify(pipata);
      erroris.textContent = '';
      if (series !== ultima.pipata) { ultima.pipata = series; reddere_pipata(pipata); }
    }).catch(function (c) { culpam_ostendere(c, 'defectus lectionis'); });
  } else if (visus === 'articuli') {
    legere('articulus').then(function (articuli) {
      var series = JSON.stringify(articuli);
      erroris.textContent = '';
      if (series !== ultima.articuli) { ultima.articuli = series; reddere_indicem(articuli); }
    }).catch(function (c) { culpam_ostendere(c, 'defectus lectionis'); });
  } else if (visus === 'articulus') {
    Promise.all([legere('articulus'), legere('commentarium')])
      .then(function (ambo) {
        var series = JSON.stringify(ambo);
        erroris.textContent = '';
        if (series !== ultima.articulus) {
          ultima.articulus = series;
          reddere_articulum(ambo[0], ambo[1]);
        }
      }).catch(function (c) { culpam_ostendere(c, 'defectus lectionis'); });
  }
}

function anquirere_nunc() { ultima = {}; anquirere(); }

setInterval(anquirere, 2000);
anquirere();

/* fumus plenus (-fumus-plenus): IS pipat in onere, C respondet
 * via daemonis, IS filium videt -> DEINDE chorographia generum
 * (G2: definire -> entia -> tabula in DOM ordinata -> creatio
 * inserta + nexus -> porticus in datis) -> fumus_perfectus.
 * Gyrus totus sine oculis. */
var fumus = { activus: false, id: null, nuntiatus: false };

function fumus_genera() {
  var def_probationis = null;
  var roma_id = null;
  return instrumentum('addere', { genus: 'definitio',
    titulus: 'Probatio Fumi',
    datum: JSON.stringify({ clavis: 'probatio_fumi',
      titulus_monstrans: 'Probatio Fumi',
      campi: [
        { clavis: 'titulus_rei', monstrans: 'Titulus', typus: 'textus' },
        { clavis: 'annus', monstrans: 'Annus', typus: 'annus' },
        { clavis: 'antiquus', monstrans: 'Antiquus', typus: 'veritas' },
        { clavis: 'sors', monstrans: 'Sors', typus: 'electio',
          optiones: ['condita', 'florens', 'lapsa'] },
        { clavis: 'auctor_fumi', monstrans: 'Auctor', typus: 'relatio',
          ad: 'auctor_fumi', cardinalitas: 'unum' }],
      campus_tituli: 'titulus_rei',
      ordo_ordinarius: { campus: 'annus', directio: 'ascendens' } }) })
  .then(function () {
    return instrumentum('addere', { genus: 'definitio',
      titulus: 'Auctor Fumi',
      datum: JSON.stringify({ clavis: 'auctor_fumi',
        titulus_monstrans: 'Auctor Fumi',
        campi: [{ clavis: 'appellatio', monstrans: 'Appellatio',
          typus: 'textus' }],
        campus_tituli: 'appellatio' }) });
  })
  .then(function () {
    return instrumentum('addere', { genus: 'probatio_fumi',
      titulus: 'Roma condita',
      datum: JSON.stringify({ titulus_rei: 'Roma condita',
        annus: -753, antiquus: true, sors: 'condita' }) });
  })
  .then(function (r) {
    roma_id = r.res_id;
    return instrumentum('addere', { genus: 'probatio_fumi',
      titulus: 'Aetas nostra',
      datum: JSON.stringify({ titulus_rei: 'Aetas nostra',
        annus: 2026, antiquus: false, sors: 'florens' }) });
  })
  .then(function () {
    /* creatio inserta simulata: ut selector - titulus machinae ET
     * campus tituli schematis ambo (paritas cum selectore) */
    return instrumentum('addere', { genus: 'auctor_fumi',
      titulus: 'Romulus',
      datum: JSON.stringify({ appellatio: 'Romulus' }) });
  })
  .then(function (r) {
    return instrumentum('gerere', { res: roma_id, actus: 'nexus',
      verbum: 'auctor_fumi', alterum: r.res_id });
  })
  .then(function () { return legere('definitio'); })
  .then(function (defs) {
    res_defs = defs;
    defs.forEach(function (d) {
      if (clavis_de(d) === 'probatio_fumi') { def_probationis = d; }
    });
    if (!def_probationis) { throw new Error('definitio non lecta'); }
    return legere('probatio_fumi');
  })
  .then(function (entia) {
    res_entia = entia;
    if (entia.length !== 2) { throw new Error('entia ' + entia.length); }
    /* nexus embeddatus cum titulo destinationis? */
    var roma = null;
    entia.forEach(function (e) {
      if (e.res_id === roma_id) { roma = e; }
    });
    var nn = roma ? nexus_de(roma, 'auctor_fumi') : [];
    if (!nn.length || nn[0].ad_titulus !== 'Romulus') {
      throw new Error('porticus: nexus sine titulo');
    }
    /* tabula in DOM: ordinata per annum ascendentem -> Roma prima */
    res_def = def_probationis;
    document.getElementById('tabula-titulus').textContent =
      titulus_de(def_probationis);
    vertere('res');
    res_vertere('tabula');
    reddere_res_tabulam();
    var ordines = document.querySelectorAll(
      '#res-tabula-continens tbody tr');
    if (ordines.length !== 2) {
      throw new Error('tabula ordines ' + ordines.length);
    }
    if (ordines[0].cells[0].textContent !== 'Roma condita') {
      throw new Error('ordinatio fracta: ' +
        ordines[0].cells[0].textContent);
    }
    if (ordines[0].cells[1].textContent !== '753 a.C.n.') {
      throw new Error('aera fracta: ' +
        ordines[0].cells[1].textContent);
    }
    if (ordines[0].cells[2].textContent !== '✓'
        || ordines[1].cells[2].textContent !== '—') {
      throw new Error('columna veritatis fracta');
    }
    if (ordines[0].cells[3].textContent !== 'condita') {
      throw new Error('columna electionis fracta');
    }
    if (ordines[0].cells[4].textContent !== 'Romulus') {
      throw new Error('columna relationis fracta');
    }
    /* emendatio generis + migratio renominationis EODEM motore quo
     * editor (sors -> fatum), entia migrata asserta (G2.2) */
    var schema_nova = JSON.parse(JSON.stringify(
      def_schema(def_probationis)));
    schema_nova.campi.forEach(function (c) {
      if (c.clavis === 'sors') { c.clavis = 'fatum'; c.monstrans = 'Fatum'; }
    });
    return genus_emendare(def_probationis, schema_nova,
      [{ vetus: 'sors', novus: 'fatum' }], res_entia)
      .then(function () { return legere('probatio_fumi'); })
      .then(function (entia2) {
        var roma2 = null;
        entia2.forEach(function (e) {
          if (e.res_id === roma_id) { roma2 = e; }
        });
        if (!roma2 || roma2.datum.fatum !== 'condita'
            || roma2.datum.sors !== undefined) {
          throw new Error('migratio renominationis fracta');
        }
        return legere('auctor_fumi');
      })
      .then(function (auctores) {
        /* creatio inserta campum tituli QUOQUE implevit? */
        var bene = auctores.some(function (a) {
          return a.datum && a.datum.appellatio === 'Romulus';
        });
        if (!bene) {
          throw new Error('creatio inserta sine campo tituli');
        }
        /* commentarium de ente (motor fili articuli reusus) */
        return internuntius.vocare('mittere',
          { genus: 'commentarium',
            corpus: '[fumus] commentarium de re', ad: roma_id });
      })
      .then(function () { return legere('commentarium'); })
      .then(function (commentaria) {
        var bene = commentaria.some(function (c) {
          return c.respondet_ad === roma_id;
        });
        if (!bene) { throw new Error('commentarium entis fractum'); }
        return internuntius.vocare('fumus_perfectus', {});
      });
  });
}

internuntius.vocare('fumus_modus', {}).then(function (r) {
  if (!r.plenus) { return; }
  fumus.activus = true;
  internuntius.vocare('mittere',
    { genus: 'pipatum', corpus: '[fumus] salve ex fenestra' })
    .then(function (rr) { fumus.id = rr.res_id; });
  setInterval(function () {
    if (!fumus.activus || !fumus.id || fumus.nuntiatus) { return; }
    internuntius.vocare('res_legere', { genus: 'pipatum' })
      .then(function (r2) {
        var visum = false;
        (r2.res || []).forEach(function (p) {
          if (p.respondet_ad === fumus.id) { visum = true; }
        });
        if (visum && !fumus.nuntiatus) {
          fumus.nuntiatus = true;
          fumus_genera().catch(function (c) {
            culpam_ostendere(c, 'fumus generum fractus');
          });
        }
      });
  }, 500);
});
