<!DOCTYPE html>
<html lang="la">
<head>
<meta charset="utf-8">
<title>mensor</title>
<style>
:root {
  --fundus: #14161a; --tabula: #1c1f25; --ora: #2b3038;
  --textus: #d8dce3; --tenuis: #8b94a3;
  --totum: #7aa2f7; --compilatio: #e0af68; --cursus: #9ece6a;
  --fracta: #f7768e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--fundus); color: var(--textus);
  font: 13px/1.5 -apple-system, "SF Mono", Menlo, monospace;
  padding: 18px;
}
h1 { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
h2 { font-size: 12px; font-weight: 600; color: var(--tenuis);
     text-transform: uppercase; letter-spacing: .09em; margin-bottom: 10px; }
.caput { display: flex; align-items: baseline; gap: 14px;
         padding-bottom: 12px; border-bottom: 1px solid var(--ora); }
.caput .nota { color: var(--tenuis); font-size: 11px; }
.tabula { background: var(--tabula); border: 1px solid var(--ora);
          border-radius: 6px; padding: 14px; margin-top: 14px; }
.claves { display: flex; gap: 16px; margin-bottom: 8px; font-size: 11px; }
.clavis { display: flex; align-items: center; gap: 5px; color: var(--tenuis); }
.pila { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td { padding: 3px 0; }
td.n { text-align: right; color: var(--tenuis);
       font-variant-numeric: tabular-nums; padding-left: 10px; }
.virga { height: 11px; border-radius: 2px; background: var(--cursus); }
.vacuum { color: var(--tenuis); padding: 22px 0; text-align: center; }
.summa { display: flex; gap: 26px; flex-wrap: wrap; }
.summa div { display: flex; flex-direction: column; }
.summa .valor { font-size: 20px; font-variant-numeric: tabular-nums; }
.summa .titulus { font-size: 10px; color: var(--tenuis);
                  text-transform: uppercase; letter-spacing: .08em; }
svg { display: block; width: 100%; }
.tendentia svg { height: 190px; }

/* Sessiones eligendae. Pyxides VERAE (non div cum onclick): manus
   eas ut affordantias premendas videt, et lector schermi quoque. */
.sessiones { display: flex; flex-wrap: wrap; gap: 6px; }
.sessio { font: inherit; font-size: 12px; cursor: pointer;
          background: #22262e; color: var(--textus);
          border: 1px solid #2b3038; border-radius: 4px;
          padding: 6px 10px; line-height: 1.35; text-align: left; }
.sessio:hover { border-color: #3d4450; }
.sessio .ordo { color: #8b94a3; margin-right: 6px; }
.sessio .dur { color: #8b94a3; margin-left: 6px; }
.sessio.electa { background: #2d3b57; border-color: #7aa2f7; }
.sessio.electa .ordo, .sessio.electa .dur { color: #c0cbe0; }
.sessio .quot { color: #6f7787; margin-left: 8px; font-size: 11px; }
/* Cursus FILTRATUS: linea intercisa, ne cum pleno confundatur.
   Tinctura sola non sufficit - forma quoque differre debet. */
.sessio.pars { border-style: dashed; opacity: .72; }
.sessio.pars .quot { color: var(--compilatio); }
.collatioLinea label { display: flex; align-items: center; gap: 5px;
                       cursor: pointer; }
.collatioLinea .sep { color: #3d4450; }

.collatioLinea { display: flex; align-items: center; gap: 10px;
                 margin-top: 10px; font-size: 12px; color: var(--tenuis); }
/* appearance:none - sine eo WebKit ornatum SUUM pingit (candidum,
   caeruleum) qui in themate obscuro alienus sedet. */
.collatioLinea select { font: inherit; font-size: 12px;
  background: #22262e; color: var(--textus); border: 1px solid #2b3038;
  border-radius: 4px; padding: 5px 26px 5px 8px; cursor: pointer;
  -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, #8b94a3 50%),
                    linear-gradient(135deg, #8b94a3 50%, transparent 50%);
  background-position: calc(100% - 14px) 12px, calc(100% - 9px) 12px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat; }
.tardior { color: var(--fracta); }
.celerior { color: var(--cursus); }
.nulla { color: var(--tenuis); }
td.delta { text-align: right; font-variant-numeric: tabular-nums;
           padding-left: 12px; }
</style>
</head>
<body>

<div class="caput">
  <h1>mensor</h1>
  <span class="nota" id="nota">…</span>
</div>

<div id="corpus"></div>

<script>
"use strict";

function fig(n, d) { return (n === null || n === undefined || isNaN(n))
  ? "—" : n.toFixed(d === undefined ? 2 : d); }

/* Elementa SVG spatium nominum PROPRIUM poscunt. Sine eo elementum
   creatur, in DOM apparet, et NIHIL pingit - fractura tacita. */
var SVG_GENERA = { svg: 1, path: 1, line: 1, circle: 1, text: 1,
                   g: 1, rect: 1, title: 1 };

function el(genus, attr, intra) {
  var e = document.createElementNS(
    SVG_GENERA[genus] ? "http://www.w3.org/2000/svg"
                      : "http://www.w3.org/1999/xhtml", genus);
  for (var k in attr) { if (attr.hasOwnProperty(k)) e.setAttribute(k, attr[k]); }
  if (intra !== undefined) { e.textContent = intra; }
  return e;
}

/* Sessiones ordine temporis; clavis sessionis tempore praefixa est */
function sessionesOrdinatae(d) {
  var claves = {};
  d.mensurae.forEach(function (m) {
    if (m.titulus === T("suita.tempus.totum")) { claves[m.sessio] = true; }
  });
  return Object.keys(claves).sort();
}

function valorem(d, sessio, titulus) {
  for (var i = 0; i < d.mensurae.length; i++) {
    var m = d.mensurae[i];
    if (m.sessio === sessio && m.titulus === titulus) { return m.valor; }
  }
  return null;
}

/* Sessio ELECTA. NIHIL = ultima (mos ante hanc facultatem).
   Status in modulo vivit, non in DOM: reddere() corpus totum
   reficit, ergo quidquid in DOM solo viveret quoque reddendo
   periret. */
var sessioElecta = null;

/* Sessio BASIS collationis. NIHIL = nulla collatio.
   'Quod commissum hoc tardius fecit' est quaestio propter quam
   mensura sine damno condit (vide mensura.h: RRD eam respondere
   NON POTEST) - et facies eam usque adhuc rogare non poterat. */
var sessioComparanda = null;

/* Solos cursus PLENOS monstrare.
   Cur omnino: sessiones cursus plenos (CXXXI probationes, ~180s) et
   cursus FILTRATOS (una probatio, ~20s) permiscent, et prius nihil
   eos distinguebat. Usor probans lineam tendentiae serratam
   (180→24→179→20→187) ut INSTABILITATEM TERRIBILEM legit antequam
   intellexit puncta poma cum piris conferri. Numerus probationum
   nunc in quaque pyxide apparet, et hoc vexillum reliqua abscondit. */
var soliPleni = false;

/* SUITA electa per PRAEFIXUM titulorum: "" = radix, "silva." = silva.
   Cursores omnes titulos eadem forma scribunt, praefixo solo
   distincti (tools/mensor_suitae.sh, 2026-09-02). Sessio unius
   suitae est; sessiones alienae absconduntur - aliter cursus silvae
   (LIII probationes, ~XIII min) in linea radicis ut 'partialis'
   appareret et tendentiam falsaret. */
var praefixum = "";
function T(t) { return praefixum + t; }
function suitae(d) {
  var s = {};
  var cauda = "suita.tempus.totum";
  d.mensurae.forEach(function (m) {
    var i = m.titulus.length - cauda.length;
    if (i >= 0 && m.titulus.substring(i) === cauda) {
      s[m.titulus.substring(0, i)] = true;
    }
  });
  return Object.keys(s).sort();
}

function probationesQuot(d, sessio) {
  var v = valorem(d, sessio, T("suita.probationes.totae"));
  return (v === null) ? 0 : v;
}

/* PLENUS = dimidium maximi saltem.
   Limen laxum consulto: cursus filtratus unam probationem habet,
   plenus centum triginta - hiatus immanis est, ergo limen medium
   utrumque robuste separat ET suitam crescentem superest (cursus
   plenus antiquus CXXXI probationum plenus manet cum suita ad CC
   creverit). */
function estPlenus(d, sessio, maximum) {
  return probationesQuot(d, sessio) * 2 >= maximum;
}

/* Tempora cursus per titulum, sessionis unius. */
function temporaCursus(d, sessio) {
  var t = {};
  d.mensurae.forEach(function (m) {
    if (m.sessio === sessio
        && m.titulus.indexOf(T("probatio.cursus.")) === 0) {
      t[m.titulus] = m.valor;
    }
  });
  return t;
}

/* Signum ET tinctura: numerus nudus lectorem cogit meminisse utra
   sessio basis sit. */
function deltaTextus(delta) {
  return (delta >= 0 ? "+" : "−") + fig(Math.abs(delta), 2) + "s";
}

/* Commissum breve, aut clavis si commissum abest (sessio ante
   integrationem git, aut arbor sordida sine commisso). */
function commissumBreve(d, clavis) {
  var r = "?";
  d.sessiones.forEach(function (s) {
    if (s.clavis === clavis && s.commissum) {
      r = s.commissum.substring(0, 8);
    }
  });
  return r;
}

/* Linea temporis: una series per titulum. 'index' = sessio electa,
   signata linea verticali ut oculus eam in tendentia inveniat. */
function seriesPingere(sessiones, series, index) {
  var lat = 800, alt = 190, ima = 24, sin = 44;
  var svg = el("svg", { viewBox: "0 0 " + lat + " " + alt,
                        preserveAspectRatio: "none" });
  var maximum = 0;
  series.forEach(function (s) {
    s.valores.forEach(function (v) { if (v !== null && v > maximum) { maximum = v; } });
  });
  if (maximum <= 0) { maximum = 1; }

  /* lineae ductrices */
  for (var g = 0; g <= 4; g++) {
    var y = 8 + (alt - ima - 8) * (g / 4);
    svg.appendChild(el("line", { x1: sin, y1: y, x2: lat, y2: y,
      stroke: "#2b3038", "stroke-width": 1 }));
    svg.appendChild(el("text", { x: 0, y: y + 4, fill: "#8b94a3",
      "font-size": 10 }, fig(maximum * (1 - g / 4), 0) + "s"));
  }

  var n = sessiones.length;
  function px(i) { return n <= 1 ? sin : sin + (lat - sin) * (i / (n - 1)); }
  function py(v) { return 8 + (alt - ima - 8) * (1 - v / maximum); }

  /* Signum sessionis electae ANTE lineas: aliter eas obtegeret. */
  if (index >= 0 && index < n) {
    svg.appendChild(el("line", { x1: px(index), y1: 4,
      x2: px(index), y2: alt - ima, stroke: "#7aa2f7",
      "stroke-width": 1, "stroke-dasharray": "3 3" }));
  }

  series.forEach(function (s) {
    var d = "", coepit = false;
    s.valores.forEach(function (v, i) {
      if (v === null) { return; }
      d += (coepit ? " L" : "M") + px(i) + "," + py(v);
      coepit = true;
    });
    if (d) {
      svg.appendChild(el("path", { d: d, fill: "none", stroke: s.color,
        "stroke-width": 2, "stroke-linejoin": "round" }));
      s.valores.forEach(function (v, i) {
        if (v !== null) {
          svg.appendChild(el("circle", { cx: px(i), cy: py(v), r: 2.5,
            fill: s.color }));
        }
      });
    }
  });

  return svg;
}

/* ---- arbor ex ligaminibus parentum ----
   Ordo scripturae NIHIL significat: proles ante parentem perficitur,
   ergo ante eum scribitur. Arbor in ligaminibus vivit. */
function arborem(d, sessio) {
  var nodi = {}, radices = [];
  d.mensurae.forEach(function (m) {
    /* Sola tempora in flammam: numeri et veritates aream non habent */
    if (m.sessio !== sessio || m.unitas !== "secunda") { return; }
    nodi[m.id] = { m: m, filiae: [] };
  });
  Object.keys(nodi).forEach(function (k) {
    var n = nodi[k];
    if (n.m.parens && nodi[n.m.parens]) {
      nodi[n.m.parens].filiae.push(n);
    } else {
      radices.push(n);
    }
  });
  function ordinare(n) {
    n.filiae.sort(function (a, b) { return b.m.valor - a.m.valor; });
    n.filiae.forEach(ordinare);
  }
  radices.forEach(ordinare);
  return radices;
}

function brevius(t) {
  return t.replace(T("suita.tempus."), "").replace(T("probatio.cursus."), "")
          .replace(T("probatio.compilatio."), "").replace("probatio_", "");
}

var TINCTURAE = ["#7aa2f7", "#e0af68", "#9ece6a", "#bb9af7", "#7dcfff"];

function flammaPingere(radices) {
  var lat = 1000, gradus = 22, margo = 2;
  /* SUMMA radicum, non MAXIMUM.
     Vitium mensuratum 2026-08-13: prius maximum sumebatur et
     quaeque radix ad x=0 latitudine PLENA ponebatur - ergo radices
     plures se invicem obtegebant et sola ULTIMA picta videbatur.
     Cum arbor una radice constat (mos post 757ff96) nihil differt;
     cum pluribus, pictura mentiebatur. Sessio antiqua id ostendit:
     CCLXV radices planae, et 'xml 0.1s' totam latitudinem tenebat. */
  var summa = 0;
  radices.forEach(function (r) { summa += r.m.valor; });
  if (summa <= 0) { return null; }

  var rect = [], altitudoMax = 0;

  function ponere(n, x, w, prof, tinctura) {
    if (w < 0.4) { return; }
    rect.push({ n: n, x: x, w: w, y: prof * gradus, t: tinctura });
    if (prof + 1 > altitudoMax) { altitudoMax = prof + 1; }
    var cursor = x, i = 0;
    n.filiae.forEach(function (f) {
      var fw = (f.m.valor / n.m.valor) * w;
      ponere(f, cursor, fw, prof + 1,
             prof === 0 ? TINCTURAE[i % TINCTURAE.length] : tinctura);
      cursor += fw;
      i++;
    });
  }

  /* Radix TINCTURAM NEUTRAM habet: eodem colore quo filia maxima
     picta, duo strata unum videbantur. */
  var cursorRadicum = 0;
  radices.forEach(function (r) {
    var w = lat * (r.m.valor / summa);
    ponere(r, cursorRadicum, w, 0, "#5a6272");
    cursorRadicum += w;
  });

  var alt = altitudoMax * gradus;
  var svg = el("svg", { viewBox: "0 0 " + lat + " " + alt,
                        preserveAspectRatio: "none",
                        style: "height:" + alt + "px" });

  rect.forEach(function (r) {
    var g = el("g", {});
    g.appendChild(el("rect", { x: r.x, y: r.y, width: Math.max(0.6, r.w - margo),
      height: gradus - margo, rx: 2, fill: r.t, "fill-opacity": 0.85 }));
    if (r.w > 46) {
      var nomen = brevius(r.n.m.titulus);
      var txt = el("text", { x: r.x + 6, y: r.y + gradus / 2 + 2,
        fill: "#14161a", "font-size": 11, "font-weight": 600 },
        nomen + "  " + fig(r.n.m.valor, 1) + "s");
      g.appendChild(txt);
    }
    var titulus = el("title", {}, r.n.m.titulus + " — " + fig(r.n.m.valor) + "s");
    g.appendChild(titulus);
    svg.appendChild(g);
  });

  return svg;
}

function reddere() {
  var d = window.MENSURAE;
  var corpus = document.getElementById("corpus");
  corpus.innerHTML = "";

  if (!d || !d.mensurae || d.mensurae.length === 0) {
    document.getElementById("nota").textContent = "nulla mensura";
    var v = el("div", { "class": "vacuum" },
      "Nullae mensurae. Curre ./compile_tests.sh");
    corpus.appendChild(v);
    return;
  }

  /* praefixum validatur contra suitas praesentes (volumen sine
     radice, silva sola: silva eligitur) */
  var omnesSuitae = suitae(d);
  if (omnesSuitae.indexOf(praefixum) < 0 && omnesSuitae.length > 0) {
    praefixum = omnesSuitae[0];
  }
  var omnesSessiones = sessionesOrdinatae(d);
  var maxProb = 0;
  omnesSessiones.forEach(function (k) {
    var q = probationesQuot(d, k);
    if (q > maxProb) { maxProb = q; }
  });

  /* Sessiones VISAE: quod vexillum reliquit. Omnia infra - pyxides,
     tendentia, index electae - ex his fluunt, ne facies partim
     filtrata partim non sit. */
  var sessiones = soliPleni
    ? omnesSessiones.filter(function (k) { return estPlenus(d, k, maxProb); })
    : omnesSessiones;
  if (sessiones.length === 0) { sessiones = omnesSessiones; }
  var ultima = sessiones[sessiones.length - 1];

  /* Electa VALIDATUR contra sessiones praesentes: datum reficitur
     dum fenestra vivit, et clavis quae evanuit tabulas vacuas
     redderet sine causa apparente. */
  var electa = (sessioElecta !== null
                && sessiones.indexOf(sessioElecta) >= 0)
             ? sessioElecta : ultima;
  var index = sessiones.indexOf(electa);

  var s0 = null;
  d.sessiones.forEach(function (s) { if (s.clavis === electa) { s0 = s; } });

  document.getElementById("nota").textContent =
    sessiones.length + " sessiones · " + d.mensurae.length + " mensurae" +
    (s0 ? " · " + s0.systema + " " + s0.architectura +
          " · machina " + s0.machina.substring(0, 8) : "");

  /* ---- suitae eligendae (cum plures) ---- */
  if (omnesSuitae.length > 1) {
    var su = el("div", { "class": "tabula", id: "tabula-suitae" });
    su.appendChild(el("h2", {}, "suitae"));
    var pyxSu = el("div", { "class": "sessiones", id: "suitae" });
    omnesSuitae.forEach(function (p) {
      var b = el("button", { "class": "sessio" + (p === praefixum ? " electa" : "") },
                 p === "" ? "radix" : p.replace(/\.$/, ""));
      b.onclick = function () {
        praefixum = p; sessioElecta = null; sessioComparanda = null; reddere();
      };
      pyxSu.appendChild(b);
    });
    su.appendChild(pyxSu);
    corpus.appendChild(su);
  }

  /* ---- sessiones eligendae ---- */
  var sel = el("div", { "class": "tabula", id: "tabula-sessiones" });
  sel.appendChild(el("h2", {}, "sessiones"));
  var pyxides = el("div", { "class": "sessiones", id: "sessiones" });
  sessiones.forEach(function (k, i) {
    var totum = valorem(d, k, T("suita.tempus.totum"));
    var comm  = commissumBreve(d, k);
    var quot  = probationesQuot(d, k);
    var plenus = estPlenus(d, k, maxProb);
    /* ORDO EX INDICE PLENO, non ex viso: aliter eadem sessio
       'XII' sine vexillo et 'IV' cum vexillo vocaretur, et duo
       nomina unius rei lectorem fallunt. Numerus PYXIDIS (i) situm
       tenet; numerus SESSIONIS identitatem. */
    var ordo = omnesSessiones.indexOf(k) + 1;
    /* ID STABILIS + aria-label: instrumentum manus hunc premit
       nomine ('#sessio-3'), et nomen quod legit hinc venit.
       Numerus probationum in nomine QUOQUE: cursus filtratus a
       pleno distinguendus est etiam ei qui pyxidem non VIDET. */
    var b = el("button", {
      id: "sessio-" + (i + 1),
      "class": "sessio" + (k === electa ? " electa" : "")
             + (plenus ? "" : " pars"),
      "aria-label": "sessio " + ordo + " " + comm + " "
        + quot + (plenus ? " probationes (plenus)" : " probationes (filtratus)")
    });
    b.appendChild(el("span", { "class": "ordo" }, String(ordo)));
    b.appendChild(el("span", {}, comm));
    b.appendChild(el("span", { "class": "dur" },
      totum === null ? "—" : fig(totum, 1) + "s"));
    b.appendChild(el("span", { "class": "quot" },
      quot + "p" + (plenus ? "" : " filtr.")));
    b.addEventListener("click", function () {
      sessioElecta = k;
      reddere();
    });
    pyxides.appendChild(b);
  });
  sel.appendChild(pyxides);

  /* Basis collationis: SELECTIO, non pyxides alterae. Undecim
     sessiones viginti duas pyxides facerent, et centum ducentas -
     selectio cum indice crescit, pyxides non. */
  var linea = el("div", { "class": "collatioLinea" });

  /* Vexillum ANTE selectionem: quid monstretur ante quid conferatur. */
  var lab = el("label", { "for": "soli-pleni" });
  var cb = el("input", { type: "checkbox", id: "soli-pleni",
                         "aria-label": "solos cursus plenos monstrare" });
  if (soliPleni) { cb.setAttribute("checked", "checked"); }
  cb.addEventListener("change", function () {
    soliPleni = cb.checked;
    reddere();
  });
  lab.appendChild(cb);
  lab.appendChild(el("span", {}, " soli cursus pleni"));
  linea.appendChild(lab);
  linea.appendChild(el("span", { "class": "sep" }, "·"));
  linea.appendChild(el("span", {}, "conferre cum"));
  var comp = el("select", { id: "comparanda",
                            "aria-label": "sessio basis collationis" });
  comp.appendChild(el("option", { value: "" }, "— nulla —"));
  sessiones.forEach(function (k, i) {
    comp.appendChild(el("option", { value: k },
      (omnesSessiones.indexOf(k) + 1) + " · " + commissumBreve(d, k)));
  });
  /* Valorem POST appensionem ponere: optio nondum exsistens
     assignationem tacite abicit. */
  comp.value = (sessioComparanda !== null) ? sessioComparanda : "";
  comp.addEventListener("change", function () {
    sessioComparanda = comp.value ? comp.value : null;
    reddere();
  });
  linea.appendChild(comp);
  sel.appendChild(linea);
  corpus.appendChild(sel);

  /* ---- summa sessionis electae ---- */
  var summa = el("div", { "class": "tabula", id: "tabula-summa" });
  summa.appendChild(el("h2", {}, "sessio " + (omnesSessiones.indexOf(electa) + 1) + " · "
    + commissumBreve(d, electa)
    + (electa === ultima ? " (ultima)" : "")));
  var box = el("div", { "class": "summa" });
  [["totum", T("suita.tempus.totum"), "s", 1],
   ["compilatio", T("suita.tempus.compilatio"), "s", 1],
   ["cursus", T("suita.tempus.cursus"), "s", 1],
   ["probationes", T("suita.probationes.totae"), "", 0],
   ["fractae", T("suita.probationes.fractae"), "", 0]
  ].forEach(function (par) {
    var v = valorem(d, electa, par[1]);
    var c = el("div");
    var n = el("span", { "class": "valor" }, fig(v, par[3]) + par[2]);
    if (par[0] === "fractae" && v > 0) { n.style.color = "var(--fracta)"; }
    c.appendChild(n);
    c.appendChild(el("span", { "class": "titulus" }, par[0]));
    box.appendChild(c);
  });
  summa.appendChild(box);
  corpus.appendChild(summa);

  /* ---- collatio duarum sessionum ---- */
  var basis = (sessioComparanda !== null
               && sessiones.indexOf(sessioComparanda) >= 0
               && sessioComparanda !== electa) ? sessioComparanda : null;

  if (basis !== null) {
    /* ORDO EX INDICE PLENO (vide pyxides supra): idem numerus
       sub quolibet vexillo. */
    var iBasis = omnesSessiones.indexOf(basis);
    var iElecta = omnesSessiones.indexOf(electa);
    var col = el("div", { "class": "tabula", id: "tabula-collatio" });
    col.appendChild(el("h2", {}, "collatio · sessio " + (iElecta + 1)
      + " − sessio " + (iBasis + 1)));

    /* Signum SEMPER electa MINUS basis: positivum = tardius nunc.
       Ordo alius numeros rectos daret et sensum inversum. */
    var caput = el("div", { "class": "collatioLinea" });
    caput.appendChild(el("span", {}, "sessio " + (iElecta + 1) + " ("
      + commissumBreve(d, electa) + ") relata ad sessionem "
      + (iBasis + 1) + " (" + commissumBreve(d, basis)
      + ") · positivum = TARDIUS"));
    col.appendChild(caput);

    var tsum = el("table", { id: "collatio-summa" });
    [["totum", T("suita.tempus.totum")],
     ["compilatio", T("suita.tempus.compilatio")],
     ["cursus", T("suita.tempus.cursus")]
    ].forEach(function (par) {
      var a = valorem(d, basis, par[1]);
      var b = valorem(d, electa, par[1]);
      var tr = el("tr");
      tr.appendChild(el("td", {}, par[0]));
      tr.appendChild(el("td", { "class": "n" }, fig(a, 1) + "s"));
      tr.appendChild(el("td", { "class": "n" }, fig(b, 1) + "s"));
      if (a === null || b === null) {
        tr.appendChild(el("td", { "class": "delta nulla" }, "—"));
      } else {
        var dl = b - a;
        tr.appendChild(el("td", { "class": "delta "
          + (dl > 0.05 ? "tardior" : (dl < -0.05 ? "celerior" : "nulla")) },
          deltaTextus(dl)));
      }
      tsum.appendChild(tr);
    });
    col.appendChild(tsum);

    /* Per probationem: quae maxime mutatae sunt. */
    var ta = temporaCursus(d, basis);
    var tb = temporaCursus(d, electa);
    var claves = {};
    Object.keys(ta).forEach(function (k) { claves[k] = 1; });
    Object.keys(tb).forEach(function (k) { claves[k] = 1; });

    var lineae = [];
    Object.keys(claves).forEach(function (k) {
      var a = (ta[k] === undefined) ? null : ta[k];
      var b = (tb[k] === undefined) ? null : tb[k];
      lineae.push({ k: k, a: a, b: b,
        d: (a === null || b === null) ? null : (b - a) });
    });

    /* Absentes PRIMUM: probatio quae abiit aut advenit mutatio
       maior est quam quaevis differentia temporis, et ordo per
       delta eas omnino celaret (delta earum NIHIL est). */
    lineae.sort(function (x, y) {
      if ((x.d === null) !== (y.d === null)) { return x.d === null ? -1 : 1; }
      return Math.abs(y.d || 0) - Math.abs(x.d || 0);
    });

    var tprob = el("table", { id: "collatio-probationes" });
    lineae.slice(0, 20).forEach(function (L) {
      var tr = el("tr");
      tr.appendChild(el("td", {}, brevius(L.k)));
      tr.appendChild(el("td", { "class": "n" },
        L.a === null ? "—" : fig(L.a) + "s"));
      tr.appendChild(el("td", { "class": "n" },
        L.b === null ? "—" : fig(L.b) + "s"));
      if (L.d === null) {
        tr.appendChild(el("td", { "class": "delta nulla" },
          L.a === null ? "nova" : "abest"));
      } else {
        tr.appendChild(el("td", { "class": "delta "
          + (L.d > 0.05 ? "tardior" : (L.d < -0.05 ? "celerior" : "nulla")) },
          deltaTextus(L.d)));
      }
      tprob.appendChild(tr);
    });
    col.appendChild(tprob);
    corpus.appendChild(col);
  }

  /* ---- flamma: UBI tempus abierit ---- */
  var radices = arborem(d, electa);
  var nodiQuot = 0;
  d.mensurae.forEach(function (m) {
    if (m.sessio === electa && m.unitas === "secunda") { nodiQuot++; }
  });

  /* NULLA ligamina parentum = nulla ARBOR, et pictura flammae
     arborem REPRAESENTAT. Radices planas summare tempus BIS
     numeraret (totum continet cursum, cursus quamque probationem),
     ergo pictura recte disposita adhuc mentiretur. Tacere et causam
     NOMINARE melius est quam pingere quod falsum sit. */
  var sineArbore = (nodiQuot > 1 && radices.length === nodiQuot);
  var f = el("div", { "class": "tabula", id: "tabula-flamma" });
  f.appendChild(el("h2", {}, "ubi tempus abierit"));

  if (sineArbore) {
    f.appendChild(el("div", { "class": "vacuum" },
      "Sessio sine arbore: " + nodiQuot + " mensurae planae, nullum"
      + " ligamen parentis. Suita arborem emittere coepit a 757ff96."));
    corpus.appendChild(f);
  } else if (radices.length > 0) {
    var flamma = flammaPingere(radices);
    if (flamma) {
      f.appendChild(flamma);
      corpus.appendChild(f);
    }
  }

  /* ---- tendentia per sessiones ---- */
  var tend = el("div", { "class": "tabula", id: "tabula-tendentia" });
  tend.appendChild(el("h2", {}, "tendentia"));
  var claves = el("div", { "class": "claves" });
  var series = [
    { titulus: "totum", clavis: T("suita.tempus.totum"), color: "#7aa2f7" },
    { titulus: "compilatio", clavis: T("suita.tempus.compilatio"), color: "#e0af68" },
    { titulus: "cursus", clavis: T("suita.tempus.cursus"), color: "#9ece6a" }
  ];
  series.forEach(function (s) {
    s.valores = sessiones.map(function (k) { return valorem(d, k, s.clavis); });
    var c = el("div", { "class": "clavis" });
    var p = el("span", { "class": "pila" });
    p.style.background = s.color;
    c.appendChild(p);
    c.appendChild(el("span", {}, s.titulus));
    claves.appendChild(c);
  });
  tend.appendChild(claves);
  var wrap = el("div", { "class": "tendentia" });
  wrap.appendChild(seriesPingere(sessiones, series, index));
  tend.appendChild(wrap);
  corpus.appendChild(tend);

  /* ---- probationes tardissimae (sessio ELECTA) ---- */
  var tard = d.mensurae.filter(function (m) {
    return m.sessio === electa && m.titulus.indexOf(T("probatio.cursus.")) === 0;
  }).sort(function (a, b) { return b.valor - a.valor; }).slice(0, 15);

  if (tard.length > 0) {
    var t = el("div", { "class": "tabula", id: "tabula-tardissimae" });
    t.appendChild(el("h2", {}, "probationes tardissimae"));
    var tab = el("table");
    var summus = tard[0].valor || 1;
    tard.forEach(function (m) {
      var tr = el("tr");
      var nomen = m.titulus.replace(T("probatio.cursus."), "");
      tr.appendChild(el("td", {}, nomen));
      var tdv = el("td", { "style": "width:52%" });
      var virga = el("div", { "class": "virga" });
      virga.style.width = Math.max(2, (m.valor / summus) * 100) + "%";
      tdv.appendChild(virga);
      tr.appendChild(tdv);
      tr.appendChild(el("td", { "class": "n" }, fig(m.valor) + "s"));
      tab.appendChild(tr);
    });
    t.appendChild(tab);
    corpus.appendChild(t);
  }
}

window.reddere = reddere;

/* Paginam paratam NUNTIARE: C datum tunc iniciet. Sine hoc nuntio
 * iniectio cum onere certaret et interdum vacuum inveniret. */
function nuntiare() {
  try {
    var h = window.webkit && window.webkit.messageHandlers;
    if (h && h.internuntius) { h.internuntius.postMessage("paratus"); }
  } catch (e) { /* sine ponte: datum iam adesse potest */ }
  reddere();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", nuntiare);
} else {
  nuntiare();
}
</script>
</body>
