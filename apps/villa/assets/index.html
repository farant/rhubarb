<!doctype html>
<html lang="la">
<head>
<meta charset="utf-8">
<title>villa</title>
<style>
/* Thema: exemplar fori (vide apps/forum) */
:root {
  --fundus: #12100e;
  --fundus-ii: #1b1815;
  --linea: #2e2925;
  --textus: #e8e2d9;
  --textus-tenuis: #9a9086;
  --accentus: #c9a227;
  --sanus: #6fa86f;
  --languidus: #c9a227;
  --fractus: #c96a5a;
  --ignotus: #6b6357;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--fundus); color: var(--textus);
  font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  -webkit-font-smoothing: antialiased;
}
header {
  padding: 14px 20px; border-bottom: 1px solid var(--linea);
  display: flex; align-items: baseline; gap: 14px;
}
h1 { margin: 0; font-size: 15px; letter-spacing: .14em;
     text-transform: uppercase; color: var(--accentus); }
h1 a { color: var(--accentus); text-decoration: none; cursor: pointer; }
#via-nav { color: var(--textus-tenuis); }
main { padding: 20px; max-width: 1100px; }
.nota { color: var(--textus-tenuis); }
#nuntius-erroris { color: var(--fractus); min-height: 1.4em; margin: 0 0 12px; }

/* punctum status */
.punctum {
  display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 8px; vertical-align: baseline;
}
.punctum.sanus     { background: var(--sanus); }
.punctum.languidus { background: var(--languidus); }
.punctum.fractus   { background: var(--fractus); }
.punctum.ignotus   { background: var(--ignotus); }

/* index servorum */
.servus-ordo {
  display: flex; align-items: baseline; gap: 12px;
  padding: 10px 12px; border: 1px solid var(--linea);
  border-radius: 4px; margin-bottom: 8px; cursor: pointer;
  background: var(--fundus-ii);
}
.servus-ordo:hover { border-color: var(--accentus); }
.servus-nomen { font-weight: bold; }
.servus-alias { color: var(--textus-tenuis); }
.servus-aetas { margin-left: auto; color: var(--textus-tenuis); white-space: nowrap; }
.servus-querelae { color: var(--fractus); }

/* forma */
.forma { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
input[type=text] {
  background: var(--fundus-ii); border: 1px solid var(--linea);
  color: var(--textus); font: inherit; padding: 6px 8px;
  border-radius: 3px;
}
input[type=text]:focus { outline: none; border-color: var(--accentus); }
button {
  background: var(--fundus-ii); border: 1px solid var(--linea);
  color: var(--textus); font: inherit; padding: 6px 12px;
  border-radius: 3px; cursor: pointer;
}
button:hover { border-color: var(--accentus); }
button:disabled { opacity: .45; cursor: default; }
button.periculosa { border-color: var(--fractus); }

/* detalia */
.vitalia { display: flex; gap: 24px; flex-wrap: wrap; margin: 12px 0 18px; }
.vitale .titulus { color: var(--textus-tenuis); font-size: 12px; }
.vitale .valor { font-size: 15px; }
table { border-collapse: collapse; width: 100%; margin: 8px 0 20px; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--linea); }
th { color: var(--textus-tenuis); font-weight: normal; font-size: 12px; }
tr.fracta td { color: var(--fractus); }
h2 {
  font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--textus-tenuis); margin: 22px 0 6px;
}
pre {
  background: var(--fundus-ii); border: 1px solid var(--linea);
  padding: 12px; border-radius: 4px; overflow-x: auto;
  white-space: pre-wrap; word-break: break-word; max-height: 420px;
  overflow-y: auto;
}
.commentarium {
  border-left: 2px solid var(--linea); padding: 4px 12px;
  margin: 10px 0;
}
.commentarium .caput { color: var(--textus-tenuis); font-size: 12px; }
textarea {
  background: var(--fundus-ii); border: 1px solid var(--linea);
  color: var(--textus); font: inherit; padding: 8px;
  border-radius: 3px; width: 100%; min-height: 60px;
}
textarea:focus { outline: none; border-color: var(--accentus); }
#actio-fructus .exitus-malus { color: var(--fractus); }
.celatum { display: none; }
</style>
</head>
<body>
<header>
  <h1><a id="domum">villa</a></h1>
  <span id="via-nav"></span>
  <span class="nota" id="summa-nav" style="margin-left:auto"></span>
</header>
<main>
  <p id="nuntius-erroris"></p>

  <!-- ===================== INDEX SERVORUM ===================== -->
  <section id="visus-index">
    <div id="index-ordines"><p class="nota">exspectans&hellip;</p></div>

    <!-- forma STATICA: numquam re-redditur, ergo focus tutus -->
    <div class="forma">
      <input type="text" id="novus-nomen" placeholder="nomen servi">
      <input type="text" id="novus-alias" placeholder="alias ssh">
      <button id="novus-addere">servum addere</button>
    </div>
    <p class="nota">servi = entia mundi (tabula Res fori eadem);
      alias = nomen in ~/.ssh/config.</p>
  </section>

  <!-- ===================== DETALIA SERVI ===================== -->
  <section id="visus-detalia" class="celatum">
    <div style="display:flex; align-items:baseline; gap:12px;">
      <span id="det-punctum" class="punctum ignotus"></span>
      <span id="det-nomen" class="servus-nomen"></span>
      <span id="det-alias" class="servus-alias"></span>
      <span id="det-aetas" class="servus-aetas"></span>
      <button id="det-probare">probare nunc</button>
    </div>
    <p id="det-querelae" class="servus-querelae"></p>

    <div class="vitalia">
      <div class="vitale"><div class="titulus">tempus activum</div>
        <div class="valor" id="det-uptime">&mdash;</div></div>
      <div class="vitale"><div class="titulus">discus</div>
        <div class="valor" id="det-discus">&mdash;</div></div>
      <div class="vitale"><div class="titulus">memoria praesto</div>
        <div class="valor" id="det-memoria">&mdash;</div></div>
      <div class="vitale"><div class="titulus">probatio</div>
        <div class="valor" id="det-mora">&mdash;</div></div>
    </div>

    <h2>servitia observata</h2>
    <div id="det-servitia"><p class="nota">nulla adhuc</p></div>

    <h2>situs nginx</h2>
    <div id="det-situs"><p class="nota">nulli adhuc</p></div>

    <h2>unitates currentes
      <button id="unitates-vertere" style="font-size:12px">ostendere</button>
    </h2>
    <div id="det-unitates" class="celatum"></div>

    <h2>actio</h2>
    <!-- forma STATICA (data-inter): poll numquam hanc zonam tangit -->
    <div class="forma">
      <input type="text" id="actio-imperium" data-inter="verum"
        placeholder="imperium remotum (concha servi)" style="flex:1">
      <button id="actio-agere">agere</button>
      <button id="actio-abrumpere" class="periculosa celatum">desistere</button>
    </div>
    <div id="actio-fructus"></div>

    <h2>commentaria</h2>
    <div id="det-commentaria"><p class="nota">nulla</p></div>
    <div class="forma" id="commentarium-forma">
      <textarea id="commentarium-corpus" data-inter="verum"
        placeholder="commentarium de hoc servo&hellip;"></textarea>
      <button id="commentarium-mittere">mittere</button>
    </div>
  </section>
</main>
<script>
/* Pons IS (window.internuntius iniectus a vitrea) */
function vocare (instrumentum, argumenta) {
  return window.internuntius.vocare(instrumentum, argumenta || {});
}
function culpam_ostendere (e) {
  document.getElementById('nuntius-erroris').textContent =
    e ? ('culpa: ' + e) : '';
}
function el (id) { return document.getElementById(id); }
function fuga (t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* mundus per transmittere: textus instrumenti ITERUM parsandus
 * (involucrum duplex - exemplar fori) */
function mundus_legere (argumenta) {
  return vocare('transmittere',
    { instrumentum: 'legere', argumenta: argumenta })
    .then(function (r) { return JSON.parse(r.textus); });
}

var TICTUS_MS      = 2000;
var INTERVALLUM_MS = 30000;   /* probatio automatica per servum */

/* status app - JS indicem ET horaria possidet (decisum V4b) */
var servi = [];          /* entia 'servus' ex mundo */
var sedes = {};          /* clavis -> summarium ex villa_status */
var horologia = {};      /* clavis -> { probata_ms, currebat } */
var visus = 'index';     /* index | detalia */
var servus_apertus = null;   /* { clavis, alias, nomen, ens } */
var detalia_ultima = '';     /* diff-poll: seriatum detaliorum */
var index_ultimus  = '';     /* diff-poll: seriatum indicis */
var detalia_data = null;     /* photographia plena currens */
var actio_currebat = false;
var ticti = 0;

/* ---------------- formata ---------------- */
function aetas_formata (ms) {
  if (ms == null) { return ''; }
  var s = Math.floor((Date.now() - ms) / 1000);
  if (s < 5)    { return 'modo probata'; }
  if (s < 120)  { return 'probata ' + s + 's abhinc'; }
  return 'probata ' + Math.floor(s / 60) + 'm abhinc';
}
function uptime_formatum (secunda) {
  var d = Math.floor(secunda / 86400);
  var h = Math.floor((secunda % 86400) / 3600);
  if (d > 0) { return d + 'd ' + h + 'h'; }
  return h + 'h ' + Math.floor((secunda % 3600) / 60) + 'm';
}
function kb_formata (kb) {
  if (kb >= 1048576) { return (kb / 1048576).toFixed(1) + ' GiB'; }
  return Math.floor(kb / 1024) + ' MiB';
}

/* ---------------- index servorum ---------------- */
function servum_ex_ente (ens) {
  var d = ens.datum || {};
  return {
    clavis: ens.res_id,
    nomen: d.nomen_servi || ens.titulus || ens.res_id,
    alias: d.alias_ssh || '',
    ens: ens
  };
}

function indicem_reddere () {
  var ordines = [];
  var visi = {};
  var i, s, sede, hor, seriatum;

  for (i = 0; i < servi.length; i++) {
    s = servum_ex_ente(servi[i]);
    visi[s.clavis] = true;
    ordines.push(ordinem_facere(s, sedes[s.clavis]));
  }
  /* sedes sine ente (praetermissio -alias evolutionis) */
  for (sede in sedes) {
    if (sedes.hasOwnProperty(sede) && !visi[sede]) {
      ordines.push(ordinem_facere(
        { clavis: sede, nomen: sede + ' (praetermissio)', alias: '' },
        sedes[sede]));
    }
  }
  seriatum = ordines.join('');
  if (seriatum === index_ultimus) { return; }
  index_ultimus = seriatum;
  el('index-ordines').innerHTML = seriatum ||
    '<p class="nota">nulli servi - adde infra</p>';

  /* audientes post redditionem */
  var nodi = el('index-ordines').querySelectorAll('.servus-ordo');
  for (i = 0; i < nodi.length; i++) {
    (function (n) {
      n.addEventListener('click', function () {
        servum_aperire(n.getAttribute('data-clavis'),
          n.getAttribute('data-alias'),
          n.getAttribute('data-nomen'),
          n.getAttribute('data-ens') === '1');
      });
    })(nodi[i]);
  }

  function ordinem_facere (s, sede) {
    var iudicium = (sede && sede.iudicium) || 'ignotus';
    var hor = horologia[s.clavis] || {};
    var partes = [];

    partes.push('<div class="servus-ordo" data-clavis="' +
      fuga(s.clavis) + '" data-alias="' + fuga(s.alias) +
      '" data-nomen="' + fuga(s.nomen) +
      '" data-ens="' + (s.ens ? '1' : '') + '">');
    partes.push('<span class="punctum ' + iudicium + '"></span>');
    partes.push('<span class="servus-nomen">' + fuga(s.nomen) + '</span>');
    if (s.alias) {
      partes.push('<span class="servus-alias">' + fuga(s.alias) + '</span>');
    }
    if (sede && sede.querelae) {
      partes.push('<span class="servus-querelae">' +
        fuga(sede.querelae) + '</span>');
    }
    partes.push('<span class="servus-aetas">' +
      (sede && sede.probatio_currit ? 'probatur&hellip;'
        : fuga(aetas_formata(hor.probata_ms))) + '</span>');
    partes.push('</div>');
    return partes.join('');
  }
}

function servos_legere () {
  return mundus_legere({ genus: 'servus', quantum: '200' })
    .then(function (entia) { servi = entia || []; })
    .catch(function () { /* mundus abesse potest - index vacuus */ });
}

/* ---------------- probationes: horaria JS ---------------- */
function statum_haurire () {
  return vocare('villa_status').then(function (r) {
    var i, o, hor;

    sedes = {};
    for (i = 0; i < (r.sedes || []).length; i++) {
      o = r.sedes[i];
      sedes[o.clavis] = o;
      hor = horologia[o.clavis] || (horologia[o.clavis] = {});
      /* transitio currit->quievit = probatio perfecta: stampa */
      if (hor.currebat && !o.probatio_currit) {
        hor.probata_ms = Date.now();
        if (visus === 'detalia' && servus_apertus &&
            servus_apertus.clavis === o.clavis) {
          detalia_haurire();
        }
      }
      hor.currebat = !!o.probatio_currit;
    }
    culpam_ostendere('');
  });
}

function probationes_movere () {
  var i, s, sede, hor;

  for (i = 0; i < servi.length; i++) {
    s = servum_ex_ente(servi[i]);
    if (!s.alias) { continue; }   /* sine alias non probamus */
    sede = sedes[s.clavis];
    hor = horologia[s.clavis] || (horologia[s.clavis] = {});
    if (sede && sede.probatio_currit) { continue; }
    if (hor.probata_ms &&
        Date.now() - hor.probata_ms < INTERVALLUM_MS) { continue; }
    if (hor.incepta_ms &&
        Date.now() - hor.incepta_ms < INTERVALLUM_MS) { continue; }
    hor.incepta_ms = Date.now();
    hor.currebat = true;
    vocare('villa_probare', { clavis: s.clavis, alias: s.alias })
      .catch(function (e) { culpam_ostendere(String(e)); });
  }
}

/* ---------------- detalia ---------------- */
function servum_aperire (clavis, alias, nomen, est_ens) {
  servus_apertus = { clavis: clavis, alias: alias, nomen: nomen,
    est_ens: !!est_ens };
  visus = 'detalia';
  detalia_ultima = '';
  detalia_data = null;
  el('visus-index').classList.add('celatum');
  el('visus-detalia').classList.remove('celatum');
  el('via-nav').textContent = '/ ' + nomen;
  el('det-nomen').textContent = nomen;
  el('det-alias').textContent = alias || '';
  el('actio-fructus').innerHTML = '';
  /* commentaria ad ens ligantur - sedes praetermissionis caret */
  el('commentarium-forma').classList.toggle('celatum',
    !servus_apertus.est_ens);
  detalia_haurire();
  commentaria_haurire();
}

function domum_redire () {
  visus = 'index';
  servus_apertus = null;
  el('visus-detalia').classList.add('celatum');
  el('visus-index').classList.remove('celatum');
  el('via-nav').textContent = '';
  index_ultimus = '';
  indicem_reddere();
}

function detalia_haurire () {
  if (!servus_apertus) { return; }
  vocare('villa_probatio', { clavis: servus_apertus.clavis })
    .then(function (p) {
      var seriatum = JSON.stringify(p);

      if (seriatum === detalia_ultima) { return; }
      detalia_ultima = seriatum;
      detalia_data = p;
      detalia_reddere(p);
    })
    .catch(function (e) { culpam_ostendere(String(e)); });
}

function detalia_reddere (p) {
  var i, s, partes;

  el('det-punctum').className = 'punctum ' + (p.iudicium || 'ignotus');
  el('det-querelae').textContent = p.querelae
    ? ('querelae: ' + p.querelae)
    : (p.felix === false
        ? (p.causa + (p.causa_textus ? ' - ' + p.causa_textus : ''))
        : '');

  el('det-uptime').textContent = p.tempus_activum
    ? uptime_formatum(p.tempus_activum) : '—';
  el('det-discus').textContent = p.discus
    ? (p.discus.capacitas + '% · ' + p.discus.punctum) : '—';
  el('det-memoria').textContent = (p.memoria && p.memoria.summa_kb)
    ? (kb_formata(p.memoria.praesto_kb) + ' / ' +
       kb_formata(p.memoria.summa_kb)) : '—';
  el('det-mora').textContent = p.mora_ms ? (p.mora_ms + ' ms') : '—';

  /* servitia observata */
  partes = [];
  if (p.servitia && p.servitia.length) {
    partes.push('<table><tr><th>servitium</th><th>vita</th>' +
      '<th>pid</th><th>restitutiones</th><th></th></tr>');
    for (i = 0; i < p.servitia.length; i++) {
      s = p.servitia[i];
      partes.push('<tr' + (s.fracta || !s.currit || !s.inventa
        ? ' class="fracta"' : '') + '>');
      partes.push('<td>' + fuga(s.id) + '</td>');
      partes.push('<td>' + (s.inventa
        ? fuga(s.vita + ' (' + s.sub + ')')
        : 'non inventa') +
        (s.fracta && s.causa_finis
          ? ' · ' + fuga(s.causa_finis) : '') + '</td>');
      partes.push('<td>' + (s.pid || '') + '</td>');
      partes.push('<td>' + (s.restitutiones || 0) + '</td>');
      partes.push('<td><button class="serv-restituere" data-unitas="' +
        fuga(s.id) + '">restituere</button> ' +
        '<button class="serv-diaria" data-unitas="' + fuga(s.id) +
        '">diaria</button></td>');
      partes.push('</tr>');
    }
    partes.push('</table>');
    el('det-servitia').innerHTML = partes.join('');
    audientes_addere('serv-restituere', function (u) {
      actionem_incipere('sudo systemctl restart ' + u);
    });
    audientes_addere('serv-diaria', function (u) {
      actionem_incipere('sudo journalctl -u ' + u +
        ' -n 100 --no-pager');
    });
  } else {
    el('det-servitia').innerHTML =
      '<p class="nota">nulla servitia observata (praetermissio: nginx)</p>';
  }

  /* situs nginx */
  partes = [];
  if (p.situs && p.situs.length) {
    partes.push('<table><tr><th>hospes</th><th>destinatio</th>' +
      '<th>ssl</th><th>redirectio</th></tr>');
    for (i = 0; i < p.situs.length; i++) {
      s = p.situs[i];
      partes.push('<tr><td>' + fuga(s.hospes) + '</td>');
      partes.push('<td>' + fuga(s.destinatio || s.radix || '') +
        (s.destinationes > 1 ? ' (1 ex ' + s.destinationes + ')' : '') +
        '</td>');
      partes.push('<td>' + (s.ssl ? 'ssl' : '') + '</td>');
      partes.push('<td>' + (s.redirectio ? 'http→https' : '') +
        '</td></tr>');
    }
    partes.push('</table>');
    el('det-situs').innerHTML = partes.join('');
  } else {
    el('det-situs').innerHTML = '<p class="nota">nulli</p>';
  }

  /* unitates currentes (celatae donec apertae) */
  partes = [];
  if (p.unitates && p.unitates.length) {
    partes.push('<table><tr><th>unitas</th><th>vita</th>' +
      '<th>descriptio</th></tr>');
    for (i = 0; i < p.unitates.length; i++) {
      s = p.unitates[i];
      partes.push('<tr><td>' + fuga(s.unitas) + '</td><td>' +
        fuga(s.vita + ' (' + s.sub + ')') + '</td><td class="nota">' +
        fuga(s.descriptio) + '</td></tr>');
    }
    partes.push('</table>');
  }
  el('det-unitates').innerHTML = partes.join('') ||
    '<p class="nota">nullae</p>';

  function audientes_addere (classis, actio) {
    var nodi = document.querySelectorAll('.' + classis);
    var k;

    for (k = 0; k < nodi.length; k++) {
      (function (n) {
        n.addEventListener('click', function (ev) {
          ev.stopPropagation();
          actio(n.getAttribute('data-unitas'));
        });
      })(nodi[k]);
    }
  }
}

/* ---------------- actiones ---------------- */
function actionem_incipere (imperium) {
  if (!servus_apertus) { return; }
  /* res SOLUM pro entibus veris: clavis entis = res_id in mundo,
   * sedes praetermissionis eventum non fert */
  vocare('villa_agere', {
    clavis: servus_apertus.clavis,
    alias: servus_apertus.alias,
    res: servus_apertus.est_ens ? servus_apertus.clavis : '',
    imperium: imperium
  }).then(function (r) {
    if (!r.incepta) {
      culpam_ostendere(r.causa || 'actio non incepta');
      return;
    }
    actio_currebat = true;
    el('actio-abrumpere').classList.remove('celatum');
    el('actio-fructus').innerHTML =
      '<p class="nota">currit: ' + fuga(imperium) + '&hellip;</p>';
  }).catch(function (e) { culpam_ostendere(String(e)); });
}

function actionem_haurire () {
  if (!servus_apertus) { return; }
  vocare('villa_actio', { clavis: servus_apertus.clavis })
    .then(function (r) {
      if (r.currit) { return; }
      actio_currebat = false;
      el('actio-abrumpere').classList.add('celatum');
      if (!r.fructus) { return; }
      var f = r.fructus;
      var partes = [];

      partes.push('<p class="' +
        (f.successus ? 'nota' : 'exitus-malus') + '">' +
        (f.successus ? 'bene' : fuga(f.causa)) +
        ' · exitus ' + f.codex + ' · ' + f.mora_ms + ' ms' +
        (f.eventus_scriptus ? ' · eventus scriptus' : '') + '</p>');
      if (f.effusio) {
        partes.push('<pre>' + fuga(f.effusio) + '</pre>');
      }
      if (f.erratum) {
        partes.push('<pre class="exitus-malus">' + fuga(f.erratum) +
          '</pre>');
      }
      el('actio-fructus').innerHTML = partes.join('');
    });
}

/* ---------------- commentaria ---------------- */
function commentaria_haurire () {
  if (!servus_apertus || !servus_apertus.clavis) { return; }
  if (!servus_apertus.est_ens) {
    el('det-commentaria').innerHTML =
      '<p class="nota">servus sine ente mundi</p>';
    return;
  }
  mundus_legere({ genus: 'commentarium', quantum: '200' })
    .then(function (entia) {
      var mea = [];
      var i, e, partes;

      for (i = 0; i < (entia || []).length; i++) {
        e = entia[i];
        if (e.respondet_ad === servus_apertus.clavis) { mea.push(e); }
      }
      partes = [];
      for (i = mea.length - 1; i >= 0; i--) {
        e = mea[i];
        partes.push('<div class="commentarium"><div class="caput">' +
          fuga(e.actor) + ' · ' +
          fuga((e.creatum || '').slice(0, 16).replace('T', ' ')) +
          '</div><div>' +
          fuga((e.datum && e.datum.corpus) || e.titulus || '') +
          '</div></div>');
      }
      el('det-commentaria').innerHTML = partes.join('') ||
        '<p class="nota">nulla</p>';
    })
    .catch(function () { /* mundus abesse potest */ });
}

function commentarium_mittere () {
  var corpus = el('commentarium-corpus').value.trim();

  if (!corpus || !servus_apertus) { return; }
  vocare('transmittere', { instrumentum: 'addere', argumenta: {
    genus: 'commentarium', corpus: corpus, ad: servus_apertus.clavis
  }}).then(function () {
    el('commentarium-corpus').value = '';
    commentaria_haurire();
  }).catch(function (e) { culpam_ostendere(String(e)); });
}

/* ---------------- servum addere ---------------- */
function servum_addere () {
  var nomen = el('novus-nomen').value.trim();
  var alias = el('novus-alias').value.trim();

  if (!nomen || !alias) {
    culpam_ostendere('nomen et alias ambo necessaria');
    return;
  }
  vocare('transmittere', { instrumentum: 'addere', argumenta: {
    genus: 'servus', titulus: nomen,
    datum: JSON.stringify({ nomen_servi: nomen, alias_ssh: alias })
  }}).then(function () {
    el('novus-nomen').value = '';
    el('novus-alias').value = '';
    servos_legere().then(function () {
      index_ultimus = '';
      indicem_reddere();
      probationes_movere();   /* probatio prima statim */
    });
  }).catch(function (e) { culpam_ostendere(String(e)); });
}

/* ---------------- ansa ---------------- */
function tictus () {
  ticti++;
  statum_haurire().then(function () {
    probationes_movere();
    if (visus === 'index') { indicem_reddere(); }
    if (visus === 'detalia' && actio_currebat) { actionem_haurire(); }
    if (visus === 'detalia' && ticti % 10 === 0) {
      commentaria_haurire();
    }
    if (visus === 'index' && ticti % 10 === 0) {
      servos_legere().then(indicem_reddere);
    }
  }).catch(function (e) { culpam_ostendere(String(e)); });
}

el('domum').addEventListener('click', domum_redire);
el('novus-addere').addEventListener('click', servum_addere);
el('det-probare').addEventListener('click', function () {
  if (!servus_apertus) { return; }
  var hor = horologia[servus_apertus.clavis] ||
    (horologia[servus_apertus.clavis] = {});

  hor.incepta_ms = Date.now();
  hor.currebat = true;
  vocare('villa_probare', {
    clavis: servus_apertus.clavis, alias: servus_apertus.alias
  }).catch(function (e) { culpam_ostendere(String(e)); });
});
el('actio-agere').addEventListener('click', function () {
  var imperium = el('actio-imperium').value.trim();

  if (imperium) { actionem_incipere(imperium); }
});
el('actio-abrumpere').addEventListener('click', function () {
  if (!servus_apertus) { return; }
  vocare('villa_abrumpere', { clavis: servus_apertus.clavis })
    .then(actionem_haurire);
});
el('unitates-vertere').addEventListener('click', function () {
  var z = el('det-unitates');
  var apertae = z.classList.contains('celatum');

  z.classList.toggle('celatum');
  el('unitates-vertere').textContent = apertae ? 'celare' : 'ostendere';
});
el('commentarium-mittere').addEventListener('click',
  commentarium_mittere);

/* initium: index ex mundo + status + ansa */
servos_legere().then(function () {
  indicem_reddere();
  return statum_haurire();
}).then(function () {
  indicem_reddere();
  probationes_movere();
}).catch(function (e) { culpam_ostendere(String(e)); });
setInterval(tictus, TICTUS_MS);
</script>
</body>
</html>
